   10. INPUT & INTERACTION
   ========================================================================== */
const keys={};
let aimHit=null, debugOn=false;
/* input is handled in the FLOW section */
function camDir(){
  return new THREE.Vector3(
    -Math.sin(player.yaw)*Math.cos(player.pitch),
    Math.sin(player.pitch),
    -Math.cos(player.yaw)*Math.cos(player.pitch));
}
function eyePos(){return new THREE.Vector3(player.pos.x,player.pos.y+player.EYE,player.pos.z);}

function attack(){
  if(player.attackCd>0)return;
  player.attackCd=0.42;
  const dir=camDir(), eye=eyePos();
  let best=null,bestD=4.2;
  for(const m of game.mobs){
    const c=m.pos.clone();c.y+=m.d.h*.5;
    const v=c.clone().sub(eye);
    const d=v.length();
    if(d>bestD)continue;
    if(v.normalize().dot(dir)<0.86)continue;
    best=m;bestD=d;
  }
  swingHand();
  if(best){
    const it=heldItem();
    const dmg=(it&&it.dmg)?it.dmg:1;
    damageMob(best,dmg,dir.x,dir.z);
    if(it&&it.dur)wearHeld(it.tool==='sword'?1:2);
    exhaust(0.1);
  }
}
function placeBlock(){
  if(!aimHit)return false;
  const s=held();if(!s)return false;
  const it=ITEMS[s.id];
  if(it.place==null)return false;
  // aiming at grass or a flower places into it rather than beside it
  const into=BLOCKS[aimHit.id].replaceable;
  const x=into?aimHit.x:aimHit.x+aimHit.nx;
  const y=into?aimHit.y:aimHit.y+aimHit.ny;
  const z=into?aimHit.z:aimHit.z+aimHit.nz;
  const there=world.getBlock(x,y,z);
  if(!isReplaceable(there)&&there!==B.water)return false;
  // don't place inside the player
  const px=player.pos.x,pz=player.pos.z,py=player.pos.y;
  if(BLOCKS[it.place].solid&&
     x+1>px-.31&&x<px+.31&&z+1>pz-.31&&z<pz+.31&&y+1>py&&y<py+player.H)return false;
  const below=world.getBlock(x,y-1,z);
  const nb=BLOCKS[it.place];
  if((it.place===B.torch||nb.needsSoil)&&!isSolid(below))return false;
  if(isPlant(it.place)&&below!==B.grass&&below!==B.dirt&&below!==B.farmland&&below!==B.snow)
    return false;
  world.setBlock(x,y,z,it.place);
  sfx.place();swingHand();
  stats.placed++;
  if(!creative()){ s.n--; if(!s.n)inv.main[inv.sel]=null; }
  player.useCd=0.18;refreshUI();
  return true;
}
function useItem(){
  if(player.useCd>0)return;
  const s=held(), it=s?ITEMS[s.id]:null;
  // interact with mobs (breed)
  const dir=camDir(),eye=eyePos();
  if(it&&(it.name==='wheat'||it.name==='seeds')){
    for(const m of game.mobs){
      const c=m.pos.clone();c.y+=m.d.h*.5;
      const v=c.clone().sub(eye);
      if(v.length()<3.6&&v.clone().normalize().dot(dir)>0.85&&m.d.breed===it.name){
        m.love=14;
        if(!creative()){s.n--;if(!s.n)inv.main[inv.sel]=null;}
        toast('The '+m.d.label.toLowerCase()+' takes the food');player.useCd=.3;refreshUI();return;}
    }
  }
  if(aimHit){
    const id=aimHit.id;
    if(id===B.crafting_table){openInventory(true);return;}
    if(id===B.furnace){openFurnace(aimHit.x,aimHit.y,aimHit.z);return;}
    if(id===B.bed){trySleep();return;}
  }
  if(it&&it.food){
    if(creative()){ sfx.eat(); player.useCd=.9; return; }
    if(eat(it.name)){sfx.eat();s.n--;if(!s.n)inv.main[inv.sel]=null;player.useCd=.9;refreshUI();}
    return;
  }
  if(it&&it.bow){ if(creative()||countItem('arrow')>0)player.bowCharge=0; else toast('No arrows'); return; }
  if(it&&it.rod){ toggleFishing(); player.useCd=.4; return; }
  if(it&&it.tool==='hoe'&&aimHit){
    const id=world.getBlock(aimHit.x,aimHit.y,aimHit.z);
    if((id===B.grass||id===B.dirt)&&world.getBlock(aimHit.x,aimHit.y+1,aimHit.z)===B.air){
      world.setBlock(aimHit.x,aimHit.y,aimHit.z,B.farmland);player.useCd=.3;
      wearHeld(1);
      toast('Tilled soil. Plant seeds on it.');return;}
  }
  if(it&&it.plant&&aimHit){
    if(world.getBlock(aimHit.x,aimHit.y,aimHit.z)===B.farmland&&
       world.getBlock(aimHit.x,aimHit.y+1,aimHit.z)===B.air){
      world.setBlock(aimHit.x,aimHit.y+1,aimHit.z,B.wheat0);
      stats.planted++;
      if(!creative()){s.n--;if(!s.n)inv.main[inv.sel]=null;}
      player.useCd=.25;refreshUI();return;}
  }
  placeBlock();
}
function releaseBow(){
  const c=player.bowCharge;player.bowCharge=-1;
  if(c<0.18)return;
  if(!creative()&&!takeItem('arrow',1))return;
  wearHeld(1);
  const power=clamp(c/1.0,0.3,1)*34;
  const dir=camDir();
  const from=eyePos().add(dir.clone().multiplyScalar(0.6));
  shootArrow(from,dir,power,'player');
  exhaust(0.05);refreshUI();
}
function trySleep(){
  if(!isNight()){toast('You can only sleep when it is dark');return;}
  const near=game.mobs.some(m=>m.d.hostile&&m.pos.distanceTo(player.pos)<10);
  if(near){toast('There are monsters nearby');return;}
  game.spawnPoint={x:player.pos.x,y:player.pos.y,z:player.pos.z};
  screenFx.sleep=1; stats.slept++;
  setTimeout(()=>{
    game.time=Math.ceil(game.time/DAY)*DAY+2;
    for(const m of[...game.mobs])if(m.d.hostile)removeMob(m);
    screenFx.sleep=0;toast('Good morning. Respawn point set.');requestSave();
  },700);
}
function toggleFishing(){
  if(player.fish){
    if(player.fish.biting){
      const r=Math.random();
      const catchId=r<.75?'raw_fish':(r<.9?'fiber':'stick');
      addItem(catchId,1);toast('Caught: '+ITEMS[catchId].label);
      if(catchId==='raw_fish')stats.fish++;
      addXP(2);refreshUI();
    }else toast('Too early — you scared it off');
    player.fish=null;return;
  }
  const dir=camDir();
  const hit=raycast(eyePos(),dir,7,true);
  if(!hit||hit.id!==B.water){toast('Cast toward water');return;}
  player.fish={t:0,wait:3+Math.random()*7,biting:false,x:hit.x,y:hit.y,z:hit.z};
  toast('Line cast. Click again when it bites.');
}
function fishTick(dt){
  if(!player.fish)return;
  const f=player.fish;f.t+=dt;
  if(!f.biting&&f.t>f.wait){f.biting=true;f.biteT=0;hint('Something is on the line — click!');}
  if(f.biting){f.biteT+=dt;if(f.biteT>1.6){f.biting=false;f.t=0;f.wait=3+Math.random()*7;hint('');}}
}

/* ---------- crops, gravity, furnaces ---------- */
let cropTimer=0;
function cropTick(dt){
  cropTimer+=dt;
  if(cropTimer<4)return;cropTimer=0;
  for(const key of[...world.crops]){
    const[x,y,z]=key.split(',').map(Number);
    const id=world.getBlock(x,y,z);
    if(id<B.wheat0||id>B.wheat3){world.crops.delete(key);continue;}
    if(id===B.wheat3)continue;
    if(Math.random()>0.30)continue;
    if(lightAt(x+.5,y+.5,z+.5)<0.55)continue;
    let wet=false;
    for(let dx=-4;dx<=4&&!wet;dx++)for(let dz=-4;dz<=4;dz++)
      if(world.getBlock(x+dx,y-1,z+dz)===B.water){wet=true;break;}
    if(!wet&&Math.random()>0.25)continue;
    world.setBlock(x,y,z,id+1);
  }
}
function gravityTick(){
  let n=0;
  while(fallQueue.length&&n++<64){
    const[x,y,z]=fallQueue.shift();
    const id=world.getBlock(x,y,z);
    if(!BLOCKS[id].gravity)continue;
    let ny=y;
    while(ny>1&&world.getBlock(x,ny-1,z)===B.air)ny--;
    if(ny!==y){world.setBlock(x,y,z,B.air);world.setBlock(x,ny,z,id);
      fallQueue.push([x,ny+1,z]);}
  }
}
function furnaceTick(dt){
  for(const[key,f]of world.furnaces){
    let changed=false;
    if(f.burn>0){f.burn-=dt;changed=true;}
    const smeltable=f.input&&SMELT[f.input.id];
    const outOK=smeltable&&(!f.out||(f.out.id===smeltable&&f.out.n<64));
    if(f.burn<=0&&outOK&&f.fuel&&FUEL[f.fuel.id]){
      f.burnMax=FUEL[f.fuel.id]*10;f.burn=f.burnMax;
      f.fuel.n--;if(!f.fuel.n)f.fuel=null;changed=true;
    }
    if(f.burn>0&&outOK){
      f.cook+=dt;changed=true;
      if(f.cook>=10){
        f.cook=0;
        f.input.n--;if(!f.input.n)f.input=null;
        if(f.out)f.out.n++;else f.out=stack(smeltable,1);
        stats.smelted++;
        addXP(Math.random()<0.7?1:0);
      }
    }else if(f.cook>0){f.cook=Math.max(0,f.cook-dt*2);changed=true;}
    if(changed&&openFurnaceKey===key)renderFurnace();
  }
}

/* ==========================================================================
   G1. BITMAP FONT RENDERER
   8px cell, variable advance, drop shadow, legacy section-sign format codes.
   ========================================================================== */
const GLYPH=Object.create(null);
let FONT_ATLAS=null;
const FONT_H=8, LINE_H=9;
(function buildFontAtlas(){
  const cols=16, cell=8;
  const keys=Object.keys(FONT_DATA);
  const rows=Math.ceil(keys.length/cols);
  const cv=document.createElement('canvas');
  cv.width=cols*cell; cv.height=rows*cell;
  const g=cv.getContext('2d');
  g.imageSmoothingEnabled=false;
  g.fillStyle='#ffffff';
  keys.forEach((ch,i)=>{
    const ox=(i%cols)*cell, oy=((i/cols)|0)*cell;
    const rs=FONT_DATA[ch].split('/');
    const w=rs[0].length;
    GLYPH[ch]={w,x:ox,y:oy};
    for(let r=0;r<8;r++){
      const s=rs[r];
      for(let c=0;c<w;c++) if(s.charCodeAt(c)===35) g.fillRect(ox+c,oy+r,1,1);
    }
  });
  FONT_ATLAS=cv;
})();
const MISSING={w:5,x:-1,y:-1};
function glyphOf(ch){
  const g=GLYPH[ch];
  if(g)return g;
  const u=GLYPH[ch.toUpperCase()]||GLYPH[ch.toLowerCase()];
  return u||GLYPH['?'];
}
const _fontTint=new Map();
function fontTinted(col){
  let c=_fontTint.get(col);
  if(c)return c;
  const cv=document.createElement('canvas');
  cv.width=FONT_ATLAS.width; cv.height=FONT_ATLAS.height;
  const g=cv.getContext('2d');
  g.imageSmoothingEnabled=false;
  g.drawImage(FONT_ATLAS,0,0);
  g.globalCompositeOperation='source-in';
  g.fillStyle=col;
  g.fillRect(0,0,cv.width,cv.height);
  _fontTint.set(col,cv);
  if(_fontTint.size>64){const k=_fontTint.keys().next().value;if(k!==col)_fontTint.delete(k);}
  return cv;
}
/* legacy colour codes */
const FMT_COLORS=['#000000','#0000aa','#00aa00','#00aaaa','#aa0000','#aa00aa','#ffaa00','#aaaaaa',
                  '#555555','#5555ff','#55ff55','#55ffff','#ff5555','#ff55ff','#ffff55','#ffffff'];
const OBF_POOL='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
function shadowOf(hex){
  const n=parseInt(hex.slice(1),16);
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return 'rgb('+(r>>2)+','+(g>>2)+','+(b>>2)+')';
}
const _shadowCache=new Map();
function shadowCol(hex){
  let s=_shadowCache.get(hex);
  if(s===undefined){s=shadowOf(hex);_shadowCache.set(hex,s);}
  return s;
}
/* walk a formatted string; cb(char, style) per visible glyph */
function fmtWalk(str,base,cb){
  let col=base,bold=false,obf=false,strike=false,under=false,ital=false;
  for(let i=0;i<str.length;i++){
    const c=str[i];
    if(c==='\u00a7'&&i+1<str.length){
      const k=str[++i].toLowerCase();
      const ci=parseInt(k,16);
      if(!isNaN(ci)&&/^[0-9a-f]$/.test(k)){col=FMT_COLORS[ci];bold=obf=strike=under=ital=false;}
      else if(k==='l')bold=true;
      else if(k==='k')obf=true;
      else if(k==='m')strike=true;
      else if(k==='n')under=true;
      else if(k==='o')ital=true;
      else if(k==='r'){col=base;bold=obf=strike=under=ital=false;}
      continue;
    }
    cb(c,col,bold,obf,strike,under,ital);
  }
}
function textWidth(str,bold0){
  let w=0;
  fmtWalk(String(str),'#ffffff',(c,col,bold)=>{
    w+=glyphOf(c).w+1+((bold||bold0)?1:0);
  });
  return w>0?w-1:0;
}
let _obfTick=0;
/* core text draw. x,y are GUI px; y is the glyph top row. */
function drawText(g,str,x,y,color,shadow){
  str=String(str);
  color=color||'#ffffff';
  const doShadow=shadow!==false;
  let cx=x;
  const draws=[];
  fmtWalk(str,color,(c,col,bold,obf,strike,under,ital)=>{
    let ch=c;
    if(obf){
      const gl=glyphOf(c);
      let t=0;
      do{ch=OBF_POOL[(Math.random()*OBF_POOL.length)|0];}while(glyphOf(ch).w!==gl.w&&++t<12);
    }
    draws.push({ch,col,bold,strike,under,ital,x:cx});
    cx+=glyphOf(ch).w+1+(bold?1:0);
  });
  const paint=(dx,dy,forceCol)=>{
    for(const d of draws){
      const gl=glyphOf(d.ch);
      const atlas=fontTinted(forceCol||d.col);
      const px=d.x+dx, py=y+dy;
      if(d.ital){
        g.drawImage(atlas,gl.x,gl.y,gl.w,4,px+1,py,gl.w,4);
        g.drawImage(atlas,gl.x,gl.y+4,gl.w,4,px,py+4,gl.w,4);
        if(d.bold){
          g.drawImage(atlas,gl.x,gl.y,gl.w,4,px+2,py,gl.w,4);
          g.drawImage(atlas,gl.x,gl.y+4,gl.w,4,px+1,py+4,gl.w,4);
        }
      }else{
        g.drawImage(atlas,gl.x,gl.y,gl.w,8,px,py,gl.w,8);
        if(d.bold)g.drawImage(atlas,gl.x,gl.y,gl.w,8,px+1,py,gl.w,8);
      }
      if(d.strike){g.fillStyle=forceCol||d.col;g.fillRect(px-1,py+3,gl.w+2+(d.bold?1:0),1);}
      if(d.under){g.fillStyle=forceCol||d.col;g.fillRect(px-1,py+8,gl.w+2+(d.bold?1:0),1);}
    }
  };
  if(doShadow)paint(1,1,shadowCol(typeof color==='string'?color:'#ffffff'));
  paint(0,0,null);
  return cx>x?cx-1:x;
}
function drawTextC(g,str,cx,y,color,shadow){
  return drawText(g,str,Math.round(cx-textWidth(str)/2),y,color,shadow);
}
function drawTextR(g,str,rx,y,color,shadow){
  return drawText(g,str,Math.round(rx-textWidth(str)),y,color,shadow);
}
/* greedy wrap to a pixel width; returns array of lines */
function wrapText(str,maxW){
  const words=String(str).split(/(\s+)/);
  const out=[];let line='';
  for(const w of words){
    if(w==='')continue;
    const test=line+w;
    if(textWidth(test)>maxW&&line.trim()!==''){out.push(line.replace(/\s+$/,''));line=w.replace(/^\s+/,'');}
    else line=test;
  }
  if(line.trim()!=='')out.push(line.replace(/\s+$/,''));
  return out.length?out:[''];
}
function trimToWidth(str,maxW,ellipsis){
  if(textWidth(str)<=maxW)return str;
  const tail=ellipsis===false?'':'...';
  const tw=textWidth(tail);
  let s=String(str);
  while(s.length&&textWidth(s)+tw>maxW)s=s.slice(0,-1);
  return s+tail;
}

function rect(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(x,y,w,h); }

/* the classic three-band widget face: 1px dark frame, bright top, shaded foot */
function widgetFace(g,x,y,w,h,st){
  if(w<=0||h<=0)return;
  g.fillStyle='#000000';
  g.fillRect(x+1,y,w-2,1); g.fillRect(x+1,y+h-1,w-2,1);
  g.fillRect(x,y+1,1,h-2); g.fillRect(x+w-1,y+1,1,h-2);
  g.fillStyle=st.body; g.fillRect(x+1,y+1,w-2,h-2);
  g.fillStyle=st.top;  g.fillRect(x+1,y+1,w-2,1);
  g.fillStyle=st.bot;  g.fillRect(x+1,y+h-3,w-2,2);
  g.globalAlpha=0.28;
  g.fillStyle='#ffffff'; g.fillRect(x+1,y+2,1,h-4);
  g.fillStyle='#000000'; g.fillRect(x+w-2,y+2,1,h-4);
  g.globalAlpha=1;
}
function focusRing(g,x,y,w,h){
  g.fillStyle='#ffffff';

/* ---- tooltip box, dark violet frame ---- */
function drawTooltip(g,lines,mx,my,guiW,guiH){
  if(!lines||!lines.length)return;
  let w=0; for(const l of lines)w=Math.max(w,textWidth(l));
  const h=lines.length===1?8:(lines.length*10-2);
  let x=mx+12, y=my-12;
  if(x+w+6>guiW)x=Math.max(4,mx-16-w);
  if(y<6)y=6;
  if(y+h+6>guiH)y=guiH-h-8;
  g.fillStyle=SKIN.tipBg;
  g.fillRect(x-3,y-4,w+6,1);
  g.fillRect(x-3,y+h+3,w+6,1);
  g.fillRect(x-4,y-3,w+8,h+6);
  const grd=g.createLinearGradient(0,y-3,0,y+h+3);
  grd.addColorStop(0,SKIN.tipEdge1); grd.addColorStop(1,SKIN.tipEdge2);
  g.fillStyle=grd;
  g.fillRect(x-3,y-3,1,h+6); g.fillRect(x+w+2,y-3,1,h+6);
  g.fillRect(x-3,y-3,w+6,1); g.fillRect(x-3,y+h+2,w+6,1);
  for(let i=0;i<lines.length;i++)
    drawText(g,lines[i],x,y+i*10,i===0?'#ffffff':'#a0a0a0');
}

/* ==========================================================================
   G3. TITLE WORDMARK — chunky beveled letters built from the bitmap font
   ========================================================================== */
let LOGO=null, LOGO_W=0, LOGO_H=0;
function buildLogo(word,sub){
  const BS=1;                    // font pixel -> logo cell
  const dep=1;                   // extrusion depth in cells
  let w=0;
  const cells=[];
  for(const ch of word){
    const gl=glyphOf(ch);
    const rows=FONT_DATA[ch]?FONT_DATA[ch].split('/'):null;
    if(!rows)continue;
    cells.push({rows,w:gl.w});
    w+=gl.w+1;
  }
  w-=1;
  const SC=6;                    // each font pixel becomes a 6x6 block
  const cw=(w+dep)*SC, chh=(8+dep)*SC;
  const cv=document.createElement('canvas');
  cv.width=cw; cv.height=chh;
  const g=cv.getContext('2d');
  g.imageSmoothingEnabled=false;
  const grid=[];
  for(let y=0;y<8;y++)grid.push(new Array(w).fill(0));
  let ox=0;
  for(const c of cells){
    for(let y=0;y<8;y++)for(let x=0;x<c.w;x++)
      if(c.rows[y][x]==='#')grid[y][ox+x]=1;
    ox+=c.w+1;
  }
  const on=(x,y)=>(x<0||y<0||x>=w||y>=8)?0:grid[y][x];
  // drop shadow / extrusion
  for(let y=0;y<8;y++)for(let x=0;x<w;x++){
    if(!on(x,y))continue;
    g.fillStyle='#2d2d2d';
    g.fillRect((x+dep)*SC,(y+dep)*SC,SC,SC);
  }
  // face with a stone-ish speckle and a lit top edge
  const r=mulberry32(0x10905);
  for(let y=0;y<8;y++)for(let x=0;x<w;x++){
    if(!on(x,y))continue;
    const px=x*SC, py=y*SC;
    for(let sy=0;sy<SC;sy++)for(let sx=0;sx<SC;sx++){
      const n=(r()-0.5)*26;
      let base=150+n;
      if(sy===0)base+=34;
      if(sy>=SC-1)base-=40;
      if(sx===0)base+=16;
      if(sx>=SC-1)base-=18;
      const v=clamp(base,40,235)|0;
      g.fillStyle='rgb('+v+','+v+','+(v-4)+')';
      g.fillRect(px+sx,py+sy,1,1);
    }
    // outline the silhouette
    g.fillStyle='#111111';
    if(!on(x,y-1))g.fillRect(px,py,SC,1);
    if(!on(x-1,y))g.fillRect(px,py,1,SC);
    if(!on(x,y+1))g.fillRect(px,py+SC-1,SC,1);
    if(!on(x+1,y))g.fillRect(px+SC-1,py,1,SC);
    // bright top-left bevel where the letter starts
    if(!on(x,y-1)){g.fillStyle='#e8e8e2';g.fillRect(px,py+1,SC,1);}
    if(!on(x-1,y)){g.fillStyle='#d8d8d2';g.fillRect(px+1,py+1,1,SC-1);}
    if(!on(x,y+1)){g.fillStyle='#4a4a48';g.fillRect(px,py+SC-2,SC,1);}
  }
  LOGO=cv; LOGO_W=cw; LOGO_H=chh;
  return cv;
}

/* ============================ storage ============================ */

/* ==========================================================================
   S2. STORAGE — tries the host's persistent store, then IndexedDB, then
   localStorage, then memory. Everything above this line is async.
   ========================================================================== */
const Store=(()=>{
  const mem=new Map();
  let backend='memory', idb=null;

  function openIDB(){
    return new Promise(res=>{
      try{
        if(!indexedDB)return res(null);
        const rq=indexedDB.open('deepwood',1);
        rq.onupgradeneeded=()=>{
          const db=rq.result;
          if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');
        };
        rq.onsuccess=()=>res(rq.result);
        rq.onerror=()=>res(null);
        setTimeout(()=>res(rq.result||null),2500);
      }catch(e){ res(null); }
    });
  }
  function idbOp(mode,fn){
    return new Promise((res,rej)=>{
      try{
        const tx=idb.transaction('kv',mode);
        const st=tx.objectStore('kv');
        const rq=fn(st);
        tx.oncomplete=()=>res(rq?rq.result:undefined);
        tx.onerror=()=>rej(tx.error);
      }catch(e){ rej(e); }
    });
  }
  async function detect(){
    if(typeof window!=='undefined'&&window.storage&&window.storage.get){
      try{ await window.storage.list('probe:',false); backend='host'; return; }
      catch(e){ /* a missing key throws; the API still works */ backend='host'; return; }
    }
    idb=await openIDB();
    if(idb){ backend='idb'; return; }
    try{ localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); backend='local'; }
    catch(e){ backend='memory'; }
  }
  const ready=detect();

  return {
    ready,
    name(){ return backend; },
    async get(k){
      await ready;
      try{
        if(backend==='host'){ const r=await window.storage.get(k,false); return r?r.value:null; }
        if(backend==='idb'){ const v=await idbOp('readonly',st=>st.get(k)); return v===undefined?null:v; }
        if(backend==='local'){ return localStorage.getItem(k); }
      }catch(e){}
      return mem.has(k)?mem.get(k):null;
    },
    async set(k,v){
      await ready;
      try{
        if(backend==='host'){ await window.storage.set(k,v,false); return true; }
        if(backend==='idb'){ await idbOp('readwrite',st=>st.put(v,k)); return true; }
        if(backend==='local'){ localStorage.setItem(k,v); return true; }
      }catch(e){ mem.set(k,v); return false; }
      mem.set(k,v); return true;
    },
    async del(k){
      await ready;
      try{
        if(backend==='host'){ await window.storage.delete(k,false); return true; }
        if(backend==='idb'){ await idbOp('readwrite',st=>st.delete(k)); return true; }
        if(backend==='local'){ localStorage.removeItem(k); return true; }
      }catch(e){}
      mem.delete(k); return true;
    }
  };
})();

/* ==========================================================================
   S3. WORLDS
   ========================================================================== */
const WORLD_INDEX='dw:index';
const SAVE_VERSION=3;
let worldIndex=null;

function newWorldId(){
  return 'w'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
}
async function readIndex(){
  if(worldIndex)return worldIndex;
  const raw=await Store.get(WORLD_INDEX);
  try{ worldIndex=raw?JSON.parse(raw):[]; }catch(e){ worldIndex=[]; }
  if(!Array.isArray(worldIndex))worldIndex=[];
  return worldIndex;
}
async function writeIndex(){
  await Store.set(WORLD_INDEX,JSON.stringify(worldIndex||[]));
}
async function listWorlds(){
  const idx=await readIndex();
  return idx.slice().sort((a,b)=>(b.lastPlayed||0)-(a.lastPlayed||0));
}
async function worldMeta(id){
  const idx=await readIndex();
  return idx.find(w=>w.id===id)||null;
}
async function deleteWorld(id){
  const idx=await readIndex();
  const i=idx.findIndex(w=>w.id===id);
  if(i>=0)idx.splice(i,1);
  await writeIndex();
  await Store.del('dw:world:'+id);
  await Store.del('dw:icon:'+id);
}
async function renameWorld(id,name){
  const m=await worldMeta(id);
  if(m){ m.name=name; await writeIndex(); }
}
async function worldNameTaken(name){
  const idx=await readIndex();
  return idx.some(w=>w.name.toLowerCase()===name.toLowerCase());
}
async function uniqueWorldName(base){
  let n=base, i=1;
  while(await worldNameTaken(n)){ n=base+' ('+(++i)+')'; }
  return n;
}

/* ---- block-edit packing: "x,y,z=id;..." keeps saves small and quick ---- */
function packEdits(map){
  const out=[];
  for(const[k,v]of map)out.push(k+'='+v);
  return out.join(';');
}
function unpackEdits(str,map){
  if(!str)return;
  for(const part of str.split(';')){
    if(!part)continue;
    const i=part.lastIndexOf('=');
    if(i<0)continue;
    map.set(part.slice(0,i),+part.slice(i+1));
  }
}
function packInv(arr){
  return arr.map(s=>s?(s.id+'*'+s.n+(s.d?('*'+s.d):'')):'').join(',');
}
function unpackInv(str,len){
  const out=new Array(len).fill(null);
  if(!str)return out;
  const parts=str.split(',');
  for(let i=0;i<Math.min(len,parts.length);i++){
    const p=parts[i];
    if(!p)continue;
    const bits=p.split('*');
    if(bits.length<2)continue;
    const d=bits.length>2?+bits.pop():0;
    const n=+bits.pop(), id=bits.join('*');
    if(ITEMS[id]&&n>0)out[i]=stack(id,n,clamp(d||0,0,Math.max(0,maxDur(id)-1)));
  }
  return out;
}

   G4. GUI SURFACE — integer-scaled overlay canvas, exactly like the real thing
   ========================================================================== */
const guiCanvas=document.getElementById('gui');
const gg=guiCanvas.getContext('2d',{alpha:true});
let guiW=480, guiH=270, guiScale=2, fbW=1, fbH=1, guiDpr=1;

function computeGuiScale(){
  const setting=settings.guiScale|0;            // 0 = auto
  guiDpr=Math.min(devicePixelRatio||1, 2);
  fbW=Math.max(1,Math.floor(innerWidth*guiDpr));
  fbH=Math.max(1,Math.floor(innerHeight*guiDpr));
  let s=1;
  while(s<9 && (setting===0 || s+1<=setting) && fbW/(s+1)>=320 && fbH/(s+1)>=240) s++;
  guiScale=s;
  guiW=Math.ceil(fbW/s); guiH=Math.ceil(fbH/s);
  if(guiCanvas.width!==fbW||guiCanvas.height!==fbH){
    guiCanvas.width=fbW; guiCanvas.height=fbH;
  }
  guiCanvas.style.width=innerWidth+'px';
  guiCanvas.style.height=innerHeight+'px';
  gg.setTransform(s,0,0,s,0,0);
  gg.imageSmoothingEnabled=false;
}
const guiMouse={x:0,y:0,down:false};
function toGui(e){
  const r=guiCanvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*guiDpr/guiScale, y:(e.clientY-r.top)*guiDpr/guiScale};
}

let uiClickSound=()=>{};
class Widget{
  constructor(x,y,w,h){this.x=x|0;this.y=y|0;this.w=w|0;this.h=h|0;
    this.visible=true;this.active=true;this.focused=false;this.tooltip=null;this.focusable=true;}
  over(mx,my){return this.visible&&mx>=this.x&&mx<this.x+this.w&&my>=this.y&&my<this.y+this.h;}
  render(){}
  mouseDown(){return false;}
  mouseUp(){}
  mouseDrag(){}
  wheel(){return false;}
  keyDown(){return false;}
  charTyped(){return false;}
  tick(){}
  tooltipAt(mx,my){return (this.tooltip&&this.over(mx,my))?this.tooltip:null;}
}

class Button extends Widget{
  constructor(x,y,w,h,label,onPress){
    super(x,y,w,h);this.label=label;this.onPress=onPress||(()=>{});
  }
  faceState(mx,my){
    if(!this.active)return SKIN.btn.disabled;
    return (this.over(mx,my)||this.focused)?SKIN.btn.hover:SKIN.btn.normal;
  }
  render(g,mx,my){
    if(!this.visible)return;
    const st=this.faceState(mx,my);
    widgetFace(g,this.x,this.y,this.w,this.h,st);
    if(this.focused)focusRing(g,this.x,this.y,this.w,this.h);
    const lab=trimToWidth(this.label,this.w-8);
    drawTextC(g,lab,this.x+this.w/2,this.y+((this.h-8)>>1),st.text);
  }
  press(){ if(!this.active)return; uiClickSound(); this.onPress(this); }
  mouseDown(mx,my,btn){
    if(btn===0&&this.active&&this.over(mx,my)){this.press();return true;}
    return false;
  }
  keyDown(e){
    if(!this.focused||!this.active)return false;
    if(e.code==='Enter'||e.code==='Space'||e.code==='NumpadEnter'){this.press();return true;}
    return false;
  }
}

/* label: value  — left click next, right click previous */
class CycleButton extends Button{
  constructor(x,y,w,h,name,values,index,onChange,labels){
    super(x,y,w,h,'',null);
    this.name=name;this.values=values;this.index=index|0;
    this.labels=labels||values.map(v=>String(v));
    this.onChange=onChange||(()=>{});
    this.sync();
  }
  sync(){ this.label=this.name+': '+this.labels[this.index]; }
  set(i){
    this.index=((i%this.values.length)+this.values.length)%this.values.length;
    this.sync(); this.onChange(this.values[this.index],this.index);
  }
  press(){ uiClickSound(); this.set(this.index+1); }
  mouseDown(mx,my,btn){
    if(!this.active||!this.over(mx,my))return false;
    if(btn===0){this.press();return true;}
    if(btn===2){uiClickSound();this.set(this.index-1);return true;}
    return false;
  }
}

class Slider extends Widget{
  constructor(x,y,w,h,value,fmt,onChange,steps){
    super(x,y,w,h);
    this.value=clamp(value,0,1);this.fmt=fmt;this.onChange=onChange||(()=>{});
    this.steps=steps||0;this.dragging=false;
  }
  snap(v){
    if(this.steps>1){const n=this.steps-1;v=Math.round(v*n)/n;}
    return clamp(v,0,1);
  }
  setFromX(mx){
    const v=this.snap((mx-this.x-4)/(this.w-8));
    if(v!==this.value){this.value=v;this.onChange(v);}
    else this.value=v;
  }
  render(g,mx,my){
    if(!this.visible)return;
    widgetFace(g,this.x,this.y,this.w,this.h,this.active?SKIN.btn.track:SKIN.btn.disabled);
    const hx=this.x+1+Math.round(this.value*(this.w-10));
    const st=this.active?((this.over(mx,my)||this.dragging||this.focused)?SKIN.btn.hover:SKIN.btn.normal)
                        :SKIN.btn.disabled;
    widgetFace(g,hx,this.y,8,this.h,st);
    if(this.focused)focusRing(g,this.x,this.y,this.w,this.h);
    const lab=trimToWidth(this.fmt(this.value),this.w-8);
    drawTextC(g,lab,this.x+this.w/2,this.y+((this.h-8)>>1),this.active?'#ffffff':'#a0a0a0');
  }
  mouseDown(mx,my,btn){
    if(btn!==0||!this.active||!this.over(mx,my))return false;
    this.dragging=true; uiClickSound(); this.setFromX(mx); return true;
  }
  mouseDrag(mx){ if(this.dragging)this.setFromX(mx); }
  mouseUp(){ this.dragging=false; }
  keyDown(e){
    if(!this.focused||!this.active)return false;
    const step=this.steps>1?1/(this.steps-1):0.05;
    if(e.code==='ArrowLeft'){this.value=this.snap(this.value-step);this.onChange(this.value);return true;}
    if(e.code==='ArrowRight'){this.value=this.snap(this.value+step);this.onChange(this.value);return true;}
    return false;
  }
}

class Checkbox extends Widget{
  constructor(x,y,label,checked,onChange){
    super(x,y,Math.max(20,20+textWidth(label)+4),20);
    this.label=label;this.checked=!!checked;this.onChange=onChange||(()=>{});
  }
  render(g,mx,my){
    const hov=this.over(mx,my);
    widgetFace(g,this.x,this.y,20,20,hov||this.focused?SKIN.btn.hover:SKIN.btn.normal);
    if(this.checked)drawTextC(g,'\u2713',this.x+10,this.y+6,'#ffffff');
    drawText(g,this.label,this.x+26,this.y+6,hov?'#ffffa0':'#ffffff');
    if(this.focused)focusRing(g,this.x,this.y,20,20);
  }
  mouseDown(mx,my,btn){
    if(btn!==0||!this.over(mx,my))return false;
    uiClickSound();this.checked=!this.checked;this.onChange(this.checked);return true;
  }
  keyDown(e){
    if(!this.focused)return false;
    if(e.code==='Enter'||e.code==='Space'){this.checked=!this.checked;uiClickSound();this.onChange(this.checked);return true;}
    return false;
  }
}

class TextField extends Widget{
  constructor(x,y,w,h,text,onChange){
    super(x,y,w,h);
    this.text=text||'';this.onChange=onChange||(()=>{});
    this.cursor=this.text.length;this.sel=this.cursor;this.scroll=0;
    this.maxLen=48;this.placeholder='';this.blink=0;this.filter=null;this.bordered=true;
  }
  setText(t){
    if(this.filter)t=this.filter(t);
    this.text=t.slice(0,this.maxLen);
    this.cursor=Math.min(this.cursor,this.text.length);
    this.sel=Math.min(this.sel,this.text.length);
    this.onChange(this.text);
  }
  innerW(){ return this.w-(this.bordered?8:0); }
  visibleText(){
    let t=this.text.slice(this.scroll);
    while(textWidth(t)>this.innerW()&&t.length)t=t.slice(0,-1);
    return t;
  }
  clampScroll(){
    if(this.cursor<this.scroll)this.scroll=this.cursor;
    let s=this.scroll;
    while(textWidth(this.text.slice(s,this.cursor))>this.innerW())s++;
    this.scroll=s;
  }
  render(g,mx,my,dt){
    if(this.bordered){
      rect(g,this.x,this.y,this.w,this.h,this.focused?'#ffffff':'#a0a0a0');
      rect(g,this.x+1,this.y+1,this.w-2,this.h-2,'#000000');
    }
    const tx=this.x+(this.bordered?4:0), ty=this.y+((this.h-8)>>1);
    const vis=this.visibleText();
    if(!this.text.length&&this.placeholder&&!this.focused){
      drawText(g,this.placeholder,tx,ty,'#707070');
    }else{
      // selection block
      if(this.sel!==this.cursor){
        const a=Math.min(this.sel,this.cursor), b=Math.max(this.sel,this.cursor);
        const sa=Math.max(a,this.scroll), sb=Math.max(b,this.scroll);
        const x0=tx+textWidth(this.text.slice(this.scroll,sa));
        const x1=tx+textWidth(this.text.slice(this.scroll,sb));
        rectA(g,x0,ty-1,Math.max(1,x1-x0),10,'#3050c0',0.85);
      }
      drawText(g,vis,tx,ty,this.active?'#e0e0e0':'#707070');
    }
    this.blink+=dt||0;
    if(this.focused&&(this.blink%1.06)<0.53){
      const cx=tx+textWidth(this.text.slice(this.scroll,this.cursor));
      rect(g,cx,ty-1,1,10,'#e0e0e0');
    }
  }
  mouseDown(mx,my,btn){
    if(btn!==0||!this.over(mx,my))return false;
    const tx=this.x+(this.bordered?4:0);
    let best=this.scroll,bd=1e9;
    for(let i=this.scroll;i<=this.text.length;i++){
      const d=Math.abs(tx+textWidth(this.text.slice(this.scroll,i))-mx);
      if(d<bd){bd=d;best=i;}
    }
    this.cursor=this.sel=best;this.blink=0;
    return true;
  }
  delSel(){
    if(this.sel===this.cursor)return false;
    const a=Math.min(this.sel,this.cursor),b=Math.max(this.sel,this.cursor);
    this.text=this.text.slice(0,a)+this.text.slice(b);
    this.cursor=this.sel=a;this.onChange(this.text);return true;
  }
  keyDown(e){
    if(!this.focused||!this.active)return false;
    const shift=e.shiftKey, ctrl=e.ctrlKey||e.metaKey;
    this.blink=0;
    if(e.code==='ArrowLeft'){this.cursor=Math.max(0,this.cursor-1);if(!shift)this.sel=this.cursor;this.clampScroll();return true;}
    if(e.code==='ArrowRight'){this.cursor=Math.min(this.text.length,this.cursor+1);if(!shift)this.sel=this.cursor;this.clampScroll();return true;}
    if(e.code==='Home'){this.cursor=0;if(!shift)this.sel=0;this.clampScroll();return true;}
    if(e.code==='End'){this.cursor=this.text.length;if(!shift)this.sel=this.cursor;this.clampScroll();return true;}
    if(ctrl&&e.code==='KeyA'){this.sel=0;this.cursor=this.text.length;return true;}
    if(e.code==='Backspace'){
      if(!this.delSel()&&this.cursor>0){
        this.text=this.text.slice(0,this.cursor-1)+this.text.slice(this.cursor);
        this.cursor--;this.sel=this.cursor;this.onChange(this.text);
      }
      this.clampScroll();return true;
    }
    if(e.code==='Delete'){
      if(!this.delSel()&&this.cursor<this.text.length){
        this.text=this.text.slice(0,this.cursor)+this.text.slice(this.cursor+1);
        this.onChange(this.text);
      }
      return true;
    }
    return false;
  }
  charTyped(ch){
    if(!this.focused||!this.active)return false;
    if(this.text.length-Math.abs(this.sel-this.cursor)>=this.maxLen)return true;
    if(this.filter&&this.filter(ch)==='')return true;
    this.delSel();
    this.text=this.text.slice(0,this.cursor)+ch+this.text.slice(this.cursor);
    this.cursor++;this.sel=this.cursor;this.onChange(this.text);this.clampScroll();
    return true;
  }
}

/* Vertical scrolling list. Subclasses paint entries. */
class ScrollList extends Widget{
  constructor(x,y,w,h,itemH){
    super(x,y,w,h);
    this.itemH=itemH;this.scroll=0;this.entries=[];this.selected=-1;
    this.onSelect=null;this.onActivate=null;this.headerH=0;
    this.lastClick=0;this.lastIdx=-1;this.dragBar=false;this.focusable=true;
  }
  contentH(){ return this.headerH+this.entries.length*this.itemH; }
  maxScroll(){ return Math.max(0,this.contentH()-this.h); }
  clampScroll(){ this.scroll=clamp(this.scroll,0,this.maxScroll()); }
  indexAt(mx,my){
    if(mx<this.x||mx>=this.x+this.w-6||my<this.y||my>=this.y+this.h)return -1;
    const rel=my-this.y+this.scroll-this.headerH;
    if(rel<0)return -1;
    const i=Math.floor(rel/this.itemH);
    return (i>=0&&i<this.entries.length)?i:-1;
  }
  renderEntry(){}
  renderHeader(){}
  render(g,mx,my,dt){
    this.clampScroll();
    g.save();
    g.beginPath();g.rect(this.x,this.y,this.w,this.h);g.clip();
    if(this.renderBg)this.renderBg(g);
    const hov=this.indexAt(mx,my);
    if(this.headerH)this.renderHeader(g,this.x,this.y-this.scroll,this.w,this.headerH);
    const first=Math.max(0,Math.floor((this.scroll-this.headerH)/this.itemH));
    const last=Math.min(this.entries.length,first+Math.ceil(this.h/this.itemH)+2);
    for(let i=first;i<last;i++){
      const ey=this.y+this.headerH+i*this.itemH-this.scroll;
      if(ey>this.y+this.h||ey+this.itemH<this.y)continue;
      this.renderEntry(g,this.entries[i],i,this.x,ey,this.w-6,this.itemH,i===hov,i===this.selected,mx,my,dt);
    }
    g.restore();
    listShadow(g,this.x,this.y,this.w,this.h);
    // scrollbar
    const ms=this.maxScroll();
    const bx=this.x+this.w-6;
    if(ms>0){
      rect(g,bx,this.y,6,this.h,'#000000');
      const bh=Math.max(32,Math.floor(this.h*this.h/this.contentH()));
      const by=this.y+Math.round(this.scroll/ms*(this.h-bh));
      rect(g,bx,by,6,bh,'#808080');
      rect(g,bx,by,5,bh-1,'#c0c0c0');
      rect(g,bx,by,5,1,'#e0e0e0');
    }
    if(this.focused)focusRing(g,this.x,this.y,this.w,this.h);
  }
  mouseDown(mx,my,btn){
    if(!this.over(mx,my))return false;
    const bx=this.x+this.w-6;
    if(mx>=bx&&this.maxScroll()>0){this.dragBar=true;this.dragTo(my);return true;}
    const i=this.indexAt(mx,my);
    if(i>=0){
      uiClickSound();
      const now=performance.now();
      const dbl=(now-this.lastClick<300&&this.lastIdx===i);
      this.lastClick=now;this.lastIdx=i;
      this.selected=i;
      if(this.onSelect)this.onSelect(i,this.entries[i]);
      if(dbl&&this.onActivate)this.onActivate(i,this.entries[i]);
      return true;
    }
    return true;
  }
  dragTo(my){
    const ms=this.maxScroll();if(!ms)return;
    const bh=Math.max(32,Math.floor(this.h*this.h/this.contentH()));
    const t=(my-this.y-bh/2)/(this.h-bh);
    this.scroll=clamp(t*ms,0,ms);
  }
  mouseDrag(mx,my){ if(this.dragBar)this.dragTo(my); }
  mouseUp(){ this.dragBar=false; }
  wheel(mx,my,d){
    if(!this.over(mx,my))return false;
    this.scroll=clamp(this.scroll+d*this.itemH*0.5,0,this.maxScroll());
    return true;
  }
  keyDown(e){
    if(!this.focused)return false;
    if(e.code==='ArrowDown'){this.moveSel(1);return true;}
    if(e.code==='ArrowUp'){this.moveSel(-1);return true;}
    if((e.code==='Enter'||e.code==='NumpadEnter')&&this.selected>=0&&this.onActivate){
      this.onActivate(this.selected,this.entries[this.selected]);return true;}
    return false;
  }
  moveSel(d){
    if(!this.entries.length)return;
    this.selected=clamp(this.selected+d,0,this.entries.length-1);
    if(this.onSelect)this.onSelect(this.selected,this.entries[this.selected]);
    const top=this.headerH+this.selected*this.itemH;
    if(top<this.scroll)this.scroll=top;
    if(top+this.itemH>this.scroll+this.h)this.scroll=top+this.itemH-this.h;
    this.clampScroll();
  }
}

/* ==========================================================================
   G6. SCREEN + STACK
   ========================================================================== */
class Screen{
  constructor(title,parent){
    this.title=title||'';this.parent=parent||null;
    this.children=[];this.pausesGame=true;this.blurBg=true;
    this.focusIndex=-1;this.grabsMouse=false;this.age=0;
  }
  add(w){this.children.push(w);return w;}
  init(){}
  rebuild(){this.children.length=0;this.focusIndex=-1;this.init();}
  renderBackground(g){
    if(worldInMemory())drawWorldBackdrop(g);
    else drawDirtBackground(g,guiW,guiH);
  }
  renderTitle(g){ if(this.title)drawTextC(g,this.title,guiW/2,15,'#ffffff'); }
  render(g,mx,my,dt){
    this.renderBackground(g);
    this.renderTitle(g);
    this.renderContent(g,mx,my,dt);
    for(const c of this.children)if(c.visible)c.render(g,mx,my,dt);
    let tip=null;
    for(const c of this.children){const t=c.tooltipAt&&c.tooltipAt(mx,my);if(t){tip=t;break;}}
    if(tip)drawTooltip(g,Array.isArray(tip)?tip:wrapText(tip,170),mx,my,guiW,guiH);
  }
  renderContent(){}
  tick(dt){this.age+=dt;for(const c of this.children)c.tick&&c.tick(dt);}
  mouseDown(mx,my,btn){
    for(let i=this.children.length-1;i>=0;i--){
      const c=this.children[i];
      if(c.visible&&c.mouseDown(mx,my,btn)){this.setFocus(i);return true;}
    }
    this.setFocus(-1);
    return false;
  }
  mouseUp(mx,my,btn){for(const c of this.children)c.mouseUp&&c.mouseUp(mx,my,btn);}
  mouseDrag(mx,my){for(const c of this.children)c.mouseDrag&&c.mouseDrag(mx,my);}
  wheel(mx,my,d){
    for(let i=this.children.length-1;i>=0;i--)
      if(this.children[i].visible&&this.children[i].wheel(mx,my,d))return true;
    return false;
  }
  setFocus(i){
    this.focusIndex=i;
    this.children.forEach((c,k)=>c.focused=(k===i));
  }
  cycleFocus(dir){
    const n=this.children.length;if(!n)return;
    let i=this.focusIndex;
    for(let k=0;k<n;k++){
      i=(i+dir+n)%n;
      const c=this.children[i];
      if(c.visible&&c.active&&c.focusable!==false){this.setFocus(i);return;}
    }
  }
  keyDown(e){
    for(const c of this.children)if(c.focused&&c.keyDown(e))return true;
    if(e.code==='Tab'){this.cycleFocus(e.shiftKey?-1:1);return true;}
    if(e.code==='Escape'){this.onEscape();return true;}
    return false;
  }
  charTyped(ch){
    for(const c of this.children)if(c.focused&&c.charTyped(ch))return true;
    return false;
  }
  onEscape(){ openScreen(this.parent); }
  onClose(){}
}

let currentScreen=null;
const screenHistory=[];
function openScreen(s){
  if(currentScreen)currentScreen.onClose();
  currentScreen=s;
  if(s){
    s.rebuild();
    if(document.pointerLockElement)document.exitPointerLock();
    if(s.pausesGame)requestWorldBackdrop();
  }else{
    if(gameIsLive())grabPointer();
  }
  syncRunState();
}

function screenPauses(){ return currentScreen!==null&&currentScreen.pausesGame; }

/* ---- frozen world backdrop, captured once when a pausing screen opens ---- */
const backdropCv=document.createElement('canvas');
const backdropCtx=backdropCv.getContext('2d');
let backdropReady=false, wantBackdrop=false;
function requestWorldBackdrop(){ if(worldInMemory())wantBackdrop=true; else backdropReady=false; }
function captureWorldBackdrop(){
  wantBackdrop=false;
  try{
    const sw=Math.max(1,Math.floor(canvas.width/2)), sh=Math.max(1,Math.floor(canvas.height/2));
    if(backdropCv.width!==sw||backdropCv.height!==sh){backdropCv.width=sw;backdropCv.height=sh;}
    backdropCtx.setTransform(1,0,0,1,0,0);
    backdropCtx.filter=settings.menuBlur>0?('blur('+(settings.menuBlur*sw/640).toFixed(2)+'px)'):'none';
    backdropCtx.drawImage(canvas,0,0,sw,sh);
    backdropCtx.filter='none';
    backdropReady=true;
  }catch(e){ backdropReady=false; }
}
function drawWorldBackdrop(g){
  if(backdropReady){
    g.imageSmoothingEnabled=settings.menuBlur>0;
    g.drawImage(backdropCv,0,0,guiW,guiH);
    g.imageSmoothingEnabled=false;
  }
  dimBackground(g,guiW,guiH);
}

/* ==========================================================================
   G10. OPTION LIST SCREEN — a scrolling two-column grid, 310px wide
   ========================================================================== */
class OptionsListScreen extends Screen{
  constructor(title,parent){ super(title,parent); this.rows=[]; this.scroll=0; this.dragBar=false; }
  buildRows(){ return []; }
  extraWidgets(){}
  init(){
    this.viewTop=32; this.viewBot=Math.max(this.viewTop+25,guiH-32);
    this.rows=this.buildRows();
    for(const r of this.rows)for(const w of r){ w.inRow=true; this.add(w); }
    this.extraWidgets();
    this.doneBtn=this.add(new Button((guiW>>1)-100,guiH-27,200,20,'Done',()=>this.done()));
    this.layout();
  }
  done(){ saveSettings(); openScreen(this.parent); }
  contentH(){ return this.rows.length*25; }
  maxScroll(){ return Math.max(0,this.contentH()-(this.viewBot-this.viewTop)); }
  layout(){
    this.scroll=clamp(this.scroll,0,this.maxScroll());
    const cx=guiW>>1;
    for(let i=0;i<this.rows.length;i++){
      const r=this.rows[i];
      const y=Math.round(this.viewTop+i*25-this.scroll);
      if(r.length===1){ r[0].x=cx-155; r[0].w=310; r[0].y=y; }
      else{ r[0].x=cx-155; r[0].w=150; r[0].y=y; r[1].x=cx+5; r[1].w=150; r[1].y=y; }
      for(const w of r)w.visible=(y+20>this.viewTop-25&&y<this.viewBot+25);
    }
  }
  render(g,mx,my,dt){
    this.renderBackground(g);
    this.renderTitle(g);
    this.layout();
    const vh=this.viewBot-this.viewTop;
    g.save(); g.beginPath(); g.rect(0,this.viewTop,guiW,vh); g.clip();
    for(const r of this.rows)for(const w of r)if(w.visible)w.render(g,mx,my,dt);
    g.restore();
    if(this.maxScroll()>0){
      listShadow(g,0,this.viewTop,guiW,vh);
      const bx=(guiW>>1)+160;
      rect(g,bx,this.viewTop,6,vh,'#000000');
      const bh=Math.max(32,Math.floor(vh*vh/this.contentH()));
      const by=this.viewTop+Math.round(this.scroll/this.maxScroll()*(vh-bh));
      rect(g,bx,by,6,bh,'#808080');
      rect(g,bx,by,5,bh-1,'#c0c0c0');
    }
    for(const c of this.children)if(!c.inRow&&c.visible)c.render(g,mx,my,dt);
    this.renderContent(g,mx,my,dt);
    let tip=null;
    if(my>=this.viewTop&&my<this.viewBot)
      for(const r of this.rows)for(const w of r){
        const t=w.visible&&w.tooltipAt&&w.tooltipAt(mx,my);
        if(t&&!tip)tip=t;
      }
    if(!tip)for(const c of this.children)
      if(!c.inRow){ const t=c.tooltipAt&&c.tooltipAt(mx,my); if(t){tip=t;break;} }
    if(tip)drawTooltip(g,Array.isArray(tip)?tip:wrapText(tip,170),mx,my,guiW,guiH);
  }
  mouseDown(mx,my,btn){
    const bx=(guiW>>1)+160;
    if(this.maxScroll()>0&&mx>=bx&&mx<bx+6&&my>=this.viewTop&&my<this.viewBot){
      this.dragBar=true; this.barTo(my); return true;
    }
    if(my>=this.viewTop&&my<this.viewBot){
      for(const r of this.rows)for(const w of r)
        if(w.visible&&w.mouseDown(mx,my,btn)){ this.setFocusW(w); return true; }
    }
    for(let i=this.children.length-1;i>=0;i--){
      const c=this.children[i];
      if(!c.inRow&&c.visible&&c.mouseDown(mx,my,btn)){ this.setFocusW(c); return true; }
    }
    this.setFocus(-1);
    return false;
  }
  setFocusW(w){ this.setFocus(this.children.indexOf(w)); }
  barTo(my){
    const vh=this.viewBot-this.viewTop;
    const bh=Math.max(32,Math.floor(vh*vh/this.contentH()));
    this.scroll=clamp((my-this.viewTop-bh/2)/(vh-bh)*this.maxScroll(),0,this.maxScroll());
  }
  mouseDrag(mx,my){
    if(this.dragBar)this.barTo(my);
    else for(const c of this.children)c.mouseDrag&&c.mouseDrag(mx,my);
  }
  mouseUp(mx,my,btn){ this.dragBar=false; super.mouseUp(mx,my,btn); }
  wheel(mx,my,d){
    if(my>=this.viewTop&&my<this.viewBot&&this.maxScroll()>0){
      this.scroll=clamp(this.scroll+d*16,0,this.maxScroll()); return true;
    }
    return super.wheel(mx,my,d);
  }
  onEscape(){ this.done(); }
}

  const i=Math.max(0,values.indexOf(cur));

}

function optSlider(fmt,value,onChange,steps,tip){

  s.tooltip=tip||null;

}

class KeyBindList extends ScrollList{
  constructor(x,y,w,h,screen){
    super(x,y,w,h,20); this.screen=screen;
  }
  renderEntry(g,e,i,x,y,w,h,hov,sel,mx,my){
    if(e.header){
      drawTextC(g,e.header,x+w/2,y+6,'#ffffff');
      return;
    }
    const conflict=keyConflicts(e.action);
    const listening=this.screen.listening===e.action;
    drawText(g,e.label,x+4,y+6,'#ffffff');
    const bw=90, bx=x+w-bw-8;
    const st=listening?SKIN.btn.hover:(hov&&mx>=bx&&mx<bx+bw?SKIN.btn.hover:SKIN.btn.normal);
    widgetFace(g,bx,y,bw,20,st);
    let lab=listening?'> '+keyName(settings.keys[e.action])+' <':keyName(settings.keys[e.action]);
    drawTextC(g,trimToWidth(lab,bw-6),bx+bw/2,y+6,
      listening?'#ffffa0':(conflict?'#ff5555':st.text));
    // reset
    const rw=44, rx=bx-rw-4;
    const changed=settings.keys[e.action]!==DEFAULT_KEYS[e.action];
    const rst=changed?(hov&&mx>=rx&&mx<rx+rw?SKIN.btn.hover:SKIN.btn.normal):SKIN.btn.disabled;
    widgetFace(g,rx,y,rw,20,rst);
    drawTextC(g,'Reset',rx+rw/2,y+6,rst.text);
    e._bx=bx;e._bw=bw;e._rx=rx;e._rw=rw;
  }
  mouseDown(mx,my,btn){
    if(!this.over(mx,my))return false;
    const bx=this.x+this.w-6;
    if(mx>=bx&&this.maxScroll()>0){this.dragBar=true;this.dragTo(my);return true;}
    const i=this.indexAt(mx,my);
    if(i<0)return true;
    const e=this.entries[i];
    if(e.header)return true;
    if(mx>=e._bx&&mx<e._bx+e._bw){ uiClickSound(); this.screen.listening=e.action; return true; }
    if(mx>=e._rx&&mx<e._rx+e._rw&&settings.keys[e.action]!==DEFAULT_KEYS[e.action]){
      uiClickSound(); settings.keys[e.action]=DEFAULT_KEYS[e.action]; saveSettings(); return true;
    }
    return true;
  }
}

/* ==========================================================================
   G16. ITEM ICONS — blocks get the classic 2:1 isometric cube, items stay flat
   ========================================================================== */
const ICON_CACHE=new Map();
function drawAtlasFace(g,tile,U,V,A,shade){
  const sx=(tile%AC)*TS, sy=((tile/AC)|0)*TS;
  g.save();
  g.transform(U[0]/TS,U[1]/TS,V[0]/TS,V[1]/TS,A[0],A[1]);
  g.drawImage(acv,sx,sy,TS,TS,0,0,TS,TS);
  if(shade<1){
    g.globalCompositeOperation='source-atop';
    g.fillStyle='rgba(0,0,0,'+(1-shade)+')';
    g.fillRect(0,0,TS,TS);
    g.globalCompositeOperation='source-over';
  }
  g.restore();
}
function buildItemIcon(id){
  const it=ITEMS[id];
  const cv=document.createElement('canvas');
  cv.width=cv.height=16;
  const g=cv.getContext('2d');
  g.imageSmoothingEnabled=false;
  if(!it){ return cv; }
  if(it.place!=null){
    const b=BLOCKS[it.place];
    const top=b.tex.top!==undefined?b.tex.top:b.tex.all;
    const side=b.tex.side!==undefined?b.tex.side:b.tex.all;
    const front=b.tex.front!==undefined?b.tex.front:side;
    if(b.render==='cross'||b.render==='torch'){
      const t=b.tex.all;
      const sx=(t%AC)*TS, sy=((t/AC)|0)*TS;
      g.drawImage(acv,sx,sy,TS,TS,0,0,16,16);
      return cv;
    }
    // left face, right face, then the lid on top
    drawAtlasFace(g,side ,[8, 4],[0,8],[0,4], 0.62);
    drawAtlasFace(g,front,[8,-4],[0,8],[8,8], 0.80);
    drawAtlasFace(g,top  ,[8,-4],[8,4],[0,4], 1.00);
  }else{
    const t=it.tile;
    const sx=(t%AC)*TS, sy=((t/AC)|0)*TS;
    g.drawImage(acv,sx,sy,TS,TS,0,0,16,16);
  }
  return cv;
}
function itemIcon(id){
  let c=ICON_CACHE.get(id);
  if(!c){ c=buildItemIcon(id); ICON_CACHE.set(id,c); }
  return c;
}
function drawStack(g,s,x,y,showCount){
  if(!s)return;
  g.drawImage(itemIcon(s.id),x,y);
  const max=maxDur(s.id);
  if(max&&s.d>0){
    const left=clamp(1-s.d/max,0,1);
    rect(g,x+2,y+13,13,2,'#000000');
    // green when fresh, red when it is about to go
    const r=Math.round(255*clamp(2-left*2,0,1)), gr=Math.round(255*clamp(left*2,0,1));
    rect(g,x+2,y+13,Math.max(1,Math.round(13*left)),1,'rgb('+r+','+gr+',0)');
  }
  if(showCount!==false&&s.n>1){
    const t=String(s.n);
    drawTextR(g,t,x+17,y+9,'#ffffff');
  }
}
function itemTooltip(s){
  if(!s)return null;
  const it=ITEMS[s.id];
  const lines=[it.label];
  if(it.food)lines.push('\u00a77Restores '+it.food+' hunger');
  if(it.tool)lines.push('\u00a77'+it.tool.charAt(0).toUpperCase()+it.tool.slice(1)+
    (it.tier?' \u00b7 '+it.tier:''));
  if(it.armor)lines.push('\u00a77Armour \u00b7 '+it.armor);
  if(it.dmg)lines.push('\u00a77'+it.dmg+' attack damage');
  if(it.fuel)lines.push('\u00a77Burns for '+it.fuel+'s');
  if(it.dur)lines.push('\u00a77Durability: '+(it.dur-(s.d||0))+' / '+it.dur);
  return lines;
}

   G17. CONTAINER SCREENS
   ========================================================================== */
class ContainerScreen extends Screen{
  constructor(title,pw,ph){
    super(title,null);
    this.pw=pw; this.ph=ph;
    this.pausesGame=false;
    this.slots=[];
    this.hover=-1;
    this.blurBg=false;
  }
  get left(){ return (guiW-this.pw)>>1; }
  get top(){ return (guiH-this.ph)>>1; }
  slot(x,y,get,set,opts){
    this.slots.push(Object.assign({x,y,get,set},opts||{}));
    return this.slots.length-1;
  }
  renderBackground(g){ dimBackground(g,guiW,guiH); }
  renderTitle(){}
  renderPanel(g){
    panelFace(g,this.left,this.top,this.pw,this.ph);
    for(const s of this.slots)slotFace(g,this.left+s.x,this.top+s.y,16);
  }
  renderLabels(g){}
  render(g,mx,my,dt){
    this.renderBackground(g);
    this.renderPanel(g);
    this.renderLabels(g);
    this.hover=-1;
    for(let i=0;i<this.slots.length;i++){
      const s=this.slots[i];
      const sx=this.left+s.x, sy=this.top+s.y;
      if(mx>=sx&&mx<sx+16&&my>=sy&&my<sy+16)this.hover=i;
      const st=s.get();
      if(st)drawStack(g,st,sx,sy);
      else if(s.ghost)s.ghost(g,sx,sy);
    }
    if(this.hover>=0)slotHighlight(g,this.left+this.slots[this.hover].x,this.top+this.slots[this.hover].y,16);
    for(const c of this.children)if(c.visible)c.render(g,mx,my,dt);
    if(inv.cursor)drawStack(g,inv.cursor,Math.round(mx-8),Math.round(my-8));
    else if(this.hover>=0){
      const s=this.slots[this.hover].get();
      const tip=itemTooltip(s);
      if(tip)drawTooltip(g,tip,mx,my,guiW,guiH);
    }
  }
  mouseDown(mx,my,btn){
    for(const c of this.children)if(c.visible&&c.mouseDown(mx,my,btn))return true;
    if(this.hover>=0){
      if(shiftHeld)quickMove(this.slots[this.hover],this);
      else slotClick(this.slots[this.hover],btn===2);
      return true;
    }
    // clicking outside the panel throws the held stack
    if(inv.cursor&&(mx<this.left||mx>=this.left+this.pw||my<this.top||my>=this.top+this.ph)){
      const dir=camDir();
      const n=(btn===2)?1:inv.cursor.n;
      spawnItem(player.pos.x+dir.x,player.pos.y+1.2,player.pos.z+dir.z,inv.cursor.id,n);
      inv.cursor.n-=n;
      if(inv.cursor.n<=0)inv.cursor=null;
      return true;
    }
    return false;
  }
  keyDown(e){
    if(e.code===settings.keys.inventory||e.code==='Escape'){ closeScreens(); return true; }
    if(/^Digit[1-9]$/.test(e.code)&&this.hover>=0){
      hotbarSwap(this.slots[this.hover],+e.code.slice(5)-1);
      return true;
    }
    return super.keyDown(e);
  }
  onClose(){ returnCraftingGrid(); }
}

function slotClick(s,right){
  const cur=inv.cursor, cont=s.get();
  if(s.takeOnly){
    if(!cont)return;
    if(!cur){ inv.cursor={id:cont.id,n:cont.n}; s.set(null); }
    else if(cur.id===cont.id&&cur.n+cont.n<=maxStack(cont.id)){ cur.n+=cont.n; s.set(null); }
    else return;
    if(s.onTake)s.onTake();
    sfx.pickup(); refreshUI(); return;
  }
  if(s.filter&&cur&&!s.filter(cur))return;
  if(!cur){
    if(!cont)return;
    if(right){
      const half=Math.ceil(cont.n/2);
      inv.cursor={id:cont.id,n:half};
      cont.n-=half; if(!cont.n)s.set(null);
    }else{ inv.cursor=cont; s.set(null); }
  }else if(!cont){
    if(right){ s.set({id:cur.id,n:1}); cur.n--; if(!cur.n)inv.cursor=null; }
    else{ s.set(cur); inv.cursor=null; }
  }else if(cont.id===cur.id){
    const ms=maxStack(cont.id);
    const c=right?Math.min(1,ms-cont.n):Math.min(cur.n,ms-cont.n);
    cont.n+=c; cur.n-=c; if(!cur.n)inv.cursor=null;
  }else if(!right){
    if(s.filter&&!s.filter(cur))return;
    inv.cursor=cont; s.set(cur);
  }
  uiClickSound(); refreshUI();
}
function quickMove(s,screen){
  const st=s.get();
  if(!st)return;
  if(s.takeOnly&&s.onTake){
    // pull everything the recipe will make
    let guard=0;
    while(s.get()&&addItem(s.get().id,s.get().n)===0&&guard++<64){ s.set(null); s.onTake(); }
    refreshUI(); return;
  }
  const target=screen.quickTarget?screen.quickTarget(s):null;
  if(target==null){
    // default: move between the main grid and the hotbar
    const from=s.invIndex;
    if(from===undefined)return;
    const range=from<9?[9,36]:[0,9];
    moveStackInto(from,range[0],range[1]);
  }else{
    const left=addItem(st.id,st.n);
    if(left!==st.n){ st.n=left; if(!st.n)s.set(null); }
  }
  uiClickSound(); refreshUI();
}
function moveStackInto(from,lo,hi){
  const s=inv.main[from]; if(!s)return;
  const ms=maxStack(s.id);
  for(let i=lo;i<hi&&s.n>0;i++){
    const t=inv.main[i];
    if(t&&t.id===s.id&&t.n<ms){ const c=Math.min(ms-t.n,s.n); t.n+=c; s.n-=c; }
  }
  for(let i=lo;i<hi&&s.n>0;i++){
    if(!inv.main[i]){ inv.main[i]={id:s.id,n:s.n}; s.n=0; }
  }
  if(!s.n)inv.main[from]=null;
}
function hotbarSwap(s,slot){
  const cur=s.get(), hb=inv.main[slot];
  if(s.takeOnly){ if(!cur)return; if(hb)return; inv.main[slot]=cur; s.set(null); if(s.onTake)s.onTake(); }
  else{ s.set(hb); inv.main[slot]=cur; }
  uiClickSound(); refreshUI();
}

  refreshUI();
}

/* The catalogue is derived from the item table, so anything added to the game
   turns up here without a second list to keep in step. */
const CREATIVE_LISTS=(()=>{
  const seen=new Set();
  const push=(arr,id)=>{ if(ITEMS[id]&&!seen.has(id)){ seen.add(id); arr.push(id); } };
  const take=(arr,ids)=>{ for(const id of ids)push(arr,id); };
  const blocks=[],nature=[],tools=[],combat=[],food=[],mats=[];
  take(blocks,['grass','dirt','stone','cobblestone','sand','gravel','planks','log',
               'wool','snow','bed','crafting_table','furnace','torch','farmland','bedrock',
               'coal_ore','iron_ore','gold_ore','gem_ore','abyss_ore']);
  take(nature,['tall_grass','flower_red','flower_yellow','flower_blue','flower_white',
               'leaves','cherry_leaves','cherry_log','berry_bush','cactus','water','lava',
               'wheat0','wheat1','wheat2','wheat3']);
  for(const k in ITEMS)if(ITEMS[k].tool&&ITEMS[k].tool!=='sword')push(tools,k);
  take(tools,['fishing_rod']);
  for(const k in ITEMS)if(ITEMS[k].tool==='sword')push(combat,k);
  take(combat,['bow','arrow']);
  for(const k in ITEMS)if(ITEMS[k].armor)push(combat,k);
  for(const k in ITEMS)if(ITEMS[k].food)push(food,k);
  for(const k in ITEMS)push(mats,k);       // everything still unclaimed
  return{blocks,nature,tools,combat,food,mats};
})();
const CREATIVE_ALL=Object.keys(ITEMS);
const CREATIVE_TABS=[
  ['Building Blocks',CREATIVE_LISTS.blocks,'stone'],
  ['Nature',         CREATIVE_LISTS.nature,'leaves'],
  ['Tools',          CREATIVE_LISTS.tools ,'iron_pick'],
  ['Combat',         CREATIVE_LISTS.combat,'iron_sword'],
  ['Foodstuffs',     CREATIVE_LISTS.food  ,'bread'],
  ['Materials',      CREATIVE_LISTS.mats  ,'iron_ingot'],
  ['Search Items',   null                 ,null],
  ['Survival Inventory',null              ,null]
];
const CREATIVE_COLS=9, CREATIVE_ROWS=5;
let creativeTab=0, creativeScroll=0, creativeQuery='';

class CreativeScreen extends ContainerScreen{
  constructor(){ super('Creative',195,136); this.tab=creativeTab; this.drag=false; }
  get isInv(){ return this.tab===7; }
  get isSearch(){ return this.tab===6; }
  init(){
    this.slots.length=0;
    this.search=null;
    if(this.isInv){
      this.pw=176; this.ph=166;
      inv.craftSize=2;
      const ARM=['helmet','chest','legs','boots'];
      for(let i=0;i<4;i++)
        this.slot(8,8+18*i,()=>inv.armor[i],v=>inv.armor[i]=v,
          {filter:s=>!s||ITEMS[s.id].armor===ARM[i],armorIndex:i});
      for(let r=0;r<2;r++)for(let c=0;c<2;c++){
        const idx=r*3+c;
        this.slot(98+18*c,18+18*r,()=>inv.craft[idx],v=>inv.craft[idx]=v,{craft:true});
      }
      this.slot(154,28,()=>{computeCraftOut();return inv.craftOut;},()=>{},
        {takeOnly:true,onTake:()=>consumeCraft()});
      for(let r=0;r<3;r++)for(let c=0;c<9;c++){
        const idx=9+r*9+c;
        this.slot(8+18*c,84+18*r,()=>inv.main[idx],v=>inv.main[idx]=v,{invIndex:idx});
      }
      for(let c=0;c<9;c++)
        this.slot(8+18*c,142,()=>inv.main[c],v=>inv.main[c]=v,{invIndex:c});
    }else{
      this.pw=195; this.ph=136;
      for(let c=0;c<9;c++)
        this.slot(9+18*c,112,()=>inv.main[c],v=>inv.main[c]=v,{invIndex:c});
      if(this.isSearch){
        const f=this.add(new TextField(this.left+80,this.top+4,88,12,creativeQuery,
          v=>{creativeQuery=v;creativeScroll=0;}));
        f.placeholder='Search\u2026';
        f.focused=true; this.focusIndex=this.children.length-1;
        this.search=f;
      }
    }
    this.clampScroll();
  }
  /* ---- the catalogue ---- */
  list(){
    if(this.isInv)return[];
    if(this.isSearch){
      const q=creativeQuery.trim().toLowerCase();
      if(!q)return CREATIVE_ALL;
      return CREATIVE_ALL.filter(id=>ITEMS[id].label.toLowerCase().includes(q)||
                                     id.toLowerCase().includes(q));
    }
    return CREATIVE_TABS[this.tab][1]||[];
  }
  pages(){ return Math.max(0,Math.ceil(this.list().length/CREATIVE_COLS)-CREATIVE_ROWS); }
  clampScroll(){ creativeScroll=clamp(creativeScroll,0,this.pages()); }
  cellAt(mx,my){
    if(this.isInv)return -1;
    const gx=this.left+9, gy=this.top+18;
    const cx=Math.floor((mx-gx)/18), cy=Math.floor((my-gy)/18);
    if(cx<0||cx>=CREATIVE_COLS||cy<0||cy>=CREATIVE_ROWS)return -1;
    if((mx-gx)%18>16||(my-gy)%18>16)return -1;
    return (cy+creativeScroll)*CREATIVE_COLS+cx;
  }
  setTab(i){
    this.tab=creativeTab=i;
    creativeScroll=0;
    if(!this.isSearch)creativeQuery='';
    returnCraftingGrid();
    this.rebuild();
    uiClickSound();
  }
  /* ---- drawing ---- */
  tabRect(i){
    const w=22, x=this.left+(this.pw-w*8)/2+i*w;
    return[Math.round(x),this.top-16,w,17];
  }
  drawTabs(g,mx,my){
    for(let i=0;i<8;i++){
      const[x,y,w,h]=this.tabRect(i);
      const on=(i===this.tab);
      rect(g,x,y,w,h,on?'#c6c6c6':'#9a9a9a');
      rect(g,x,y,w,1,on?'#ffffff':'#d2d2d2');
      rect(g,x,y,1,h,on?'#ffffff':'#d2d2d2');
      rect(g,x+w-1,y,1,h,'#555555');
      if(!on)rect(g,x,y+h-1,w,1,'#555555');
      const icon=CREATIVE_TABS[i][2];
      if(icon&&ITEMS[icon])g.drawImage(itemIcon(icon),x+4,y+(on?2:3));
      else if(i===6)drawSearchIcon(g,x+7,y+(on?4:5));
      else drawInvIcon(g,x+6,y+(on?3:4));
    }
  }
  renderPanel(g){
    panelFace(g,this.left,this.top,this.pw,this.ph);
    this.drawTabs(g,0,0);
    for(const s of this.slots)slotFace(g,this.left+s.x,this.top+s.y,16);
    if(!this.isInv){
      const gx=this.left+9, gy=this.top+18;
      for(let r=0;r<CREATIVE_ROWS;r++)for(let c=0;c<CREATIVE_COLS;c++)
        slotFace(g,gx+c*18,gy+r*18,16);
      // scroll track and knob
      const sx=this.left+175, sy=this.top+18, sh2=CREATIVE_ROWS*18-2;
      rect(g,sx,sy,12,sh2,'#000000');
      const pg=this.pages();
      const kh=15, ky=sy+(pg?Math.round((sh2-kh)*(creativeScroll/pg)):0);
      rect(g,sx,ky,12,kh,pg?'#c6c6c6':'#6a6a6a');
      rect(g,sx,ky,12,1,'#ffffff'); rect(g,sx,ky,1,kh,'#ffffff');
      rect(g,sx+11,ky,1,kh,'#555555'); rect(g,sx,ky+kh-1,12,1,'#555555');
    }
  }
  renderLabels(g){
    const title=CREATIVE_TABS[this.tab][0];
    if(this.isInv){
      drawText(g,'Crafting',this.left+97,this.top+8,SKIN.label,false);
      drawText(g,'Inventory',this.left+8,this.top+72,SKIN.label,false);
      const bx=this.left+26, by=this.top+8;
      rect(g,bx,by,52,70,'#8b8b8b');
      rect(g,bx,by,51,1,'#373737'); rect(g,bx,by,1,69,'#373737');
      rect(g,bx,by+69,52,1,'#ffffff'); rect(g,bx+51,by,1,70,'#ffffff');
      drawPlayerBust(g,bx+26,by+66,2);
      drawArrow(g,this.left+128,this.top+31);
    }else{
      drawText(g,title,this.left+8,this.top+5,SKIN.label,false);
    }
  }
  render(g,mx,my,dt){
    this.renderBackground(g);
    this.renderPanel(g);
    this.renderLabels(g);
    // hotbar / inventory slots
    this.hover=-1;
    for(let i=0;i<this.slots.length;i++){
      const s=this.slots[i];
      const sx=this.left+s.x, sy=this.top+s.y;
      if(mx>=sx&&mx<sx+16&&my>=sy&&my<sy+16)this.hover=i;
      const st=s.get();
      if(st)drawStack(g,st,sx,sy);
    }
    // catalogue
    let tipId=null;
    if(!this.isInv){
      const L=this.list(), gx=this.left+9, gy=this.top+18;
      const hovCell=this.cellAt(mx,my);
      for(let r=0;r<CREATIVE_ROWS;r++)for(let c=0;c<CREATIVE_COLS;c++){
        const i=(r+creativeScroll)*CREATIVE_COLS+c;
        if(i>=L.length)continue;
        drawStack(g,{id:L[i],n:1},gx+c*18,gy+r*18,false);
      }
      if(hovCell>=0&&hovCell<L.length){
        const r=Math.floor(hovCell/CREATIVE_COLS)-creativeScroll, c=hovCell%CREATIVE_COLS;
        slotHighlight(g,gx+c*18,gy+r*18,16);
        tipId=L[hovCell];
      }
      if(L.length===0)drawTextC(g,'\u00a77nothing matches',this.left+90,this.top+58,'#707070');
    }
    if(this.hover>=0)slotHighlight(g,this.left+this.slots[this.hover].x,
      this.top+this.slots[this.hover].y,16);
    for(const c of this.children)if(c.visible)c.render(g,mx,my,dt);
    if(inv.cursor)drawStack(g,inv.cursor,Math.round(mx-8),Math.round(my-8));
    else{
      let tip=null;
      if(tipId)tip=itemTooltip({id:tipId,n:1});
      else if(this.hover>=0)tip=itemTooltip(this.slots[this.hover].get());
      if(tip)drawTooltip(g,tip,mx,my,guiW,guiH);
    }
  }
  /* ---- input ---- */
  mouseDown(mx,my,btn){
    for(let i=0;i<8;i++){
      const[x,y,w,h]=this.tabRect(i);
      if(mx>=x&&mx<x+w&&my>=y&&my<y+h){ if(i!==this.tab)this.setTab(i); return true; }
    }
    if(!this.isInv){
      // scrollbar
      const sx=this.left+175, sy=this.top+18, sh2=CREATIVE_ROWS*18-2;
      if(mx>=sx&&mx<sx+12&&my>=sy&&my<sy+sh2){ this.drag=true; this.dragTo(my); return true; }
      const cell=this.cellAt(mx,my), L=this.list();
      if(cell>=0){
        if(cell<L.length){
          const id=L[cell];
          if(shiftHeld){
            addItem(id,maxStack(id));
            sfx.pickup(); refreshUI(); return true;
          }
          if(inv.cursor&&inv.cursor.id===id&&btn!==2){
            // clicking the same item again tops the held stack up
            inv.cursor.n=maxStack(id);
          }else if(inv.cursor&&btn!==2){
            inv.cursor=null;                    // dropping onto the list bins it
          }else{
            inv.cursor={id,n:btn===2?1:maxStack(id)};
          }
        }else if(inv.cursor){ inv.cursor=null; }
        uiClickSound(); refreshUI(); return true;
      }
    }
    return super.mouseDown(mx,my,btn);
  }
  dragTo(my){
    const sy=this.top+18, sh2=CREATIVE_ROWS*18-2, pg=this.pages();
    if(!pg)return;
    creativeScroll=Math.round(clamp((my-sy-7)/(sh2-15),0,1)*pg);
  }
  mouseDrag(mx,my){ if(this.drag)this.dragTo(my); else super.mouseDrag(mx,my); }
  mouseUp(mx,my,btn){ this.drag=false; super.mouseUp(mx,my,btn); }
  wheel(mx,my,d){
    if(!this.isInv&&this.pages()){ creativeScroll=clamp(creativeScroll+d,0,this.pages()); return true; }
    return super.wheel(mx,my,d);
  }
  keyDown(e){
    if(this.search&&this.search.focused){
      if(e.code==='Escape'){ closeScreens(); return true; }
      if(this.search.keyDown(e))return true;
      if(e.code==='Tab')return true;
      return false;          // plain letters fall through to charTyped
    }
    return super.keyDown(e);
  }
  charTyped(ch){
    if(this.search&&this.search.focused)return this.search.charTyped(ch);
    return super.charTyped(ch);
  }
  quickTarget(s){ return s.armorIndex!==undefined?true:null; }
}

/* the portrait is a straight front-on read of the player's own skin, so it
   always matches the arm you see in first person */
function drawPlayerBust(g,cx,by,scale){
  const cv=SKINCV.player; if(!cv)return;
  const s=Math.max(1,Math.round(scale||2)), P=MODELS.player;
  const front=k=>netRects(P[k].u,P[k].v,P[k].w,P[k].h,P[k].d).front;
  const put=(k,dx,dy)=>{ const r=front(k);
    g.drawImage(cv,r[0],r[1],r[2],r[3],
      Math.round(cx+dx*s),Math.round(by+dy*s),r[2]*s,r[3]*s); };
  const sm=g.imageSmoothingEnabled; g.imageSmoothingEnabled=false;
  put('leg',-4,-12); put('leg',0,-12);
  put('body',-4,-24);
  put('arm',-8,-24); put('arm',4,-24);
  put('head',-4,-32);
  g.imageSmoothingEnabled=sm;
}

function pixelIcon(rows,map){
  const h=rows.length, w=rows[0].length;
  const cv=document.createElement('canvas');
  cv.width=w; cv.height=h;
  const g=cv.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const c=map[rows[y][x]];
    if(!c)continue;
    g.fillStyle=c; g.fillRect(x,y,1,1);
  }
  return cv;
}

let VIEW=8, meshQueueLen=0, genQueueLen=0;
function surfaceY(x,z){
  for(let y=WH-1;y>1;y--){
    const id=world.getBlock(x,y,z);
    if(isSolid(id))return y+1;
  }

function ensureChunksAround(force=false){
  VIEW=settings.renderDistance;
  const pcx=Math.floor(player.pos.x)>>4, pcz=Math.floor(player.pos.z)>>4;
  const need=[];
  for(let dx=-VIEW;dx<=VIEW;dx++)for(let dz=-VIEW;dz<=VIEW;dz++){
    const d=Math.hypot(dx,dz);
    if(d>VIEW+.5)continue;
    const cx=pcx+dx,cz=pcz+dz;
    if(!world.chunks.has(ckey(cx,cz)))need.push([d,cx,cz]);
  }
  need.sort((a,b)=>a[0]-b[0]);
  genQueueLen=need.length;
  const list=force?need.filter(n=>n[0]<=3.2):need;
  const blocking=(settings.chunkBuilder==='fully');
  const t0=performance.now();
  const genMs=force?1e9:(blocking?9:4);
  let made=0;
  for(let i=0;i<list.length;i++){
    const c=genChunk(list[i][1],list[i][2]);
    chunkSkyColumns(c);propagate();
    markDirtyAround(list[i][1]<<4,0,list[i][2]<<4);
    made++;
    if(performance.now()-t0>genMs)break;
  }
  // unload anything that drifted out of range
  for(const[k,c]of world.chunks){
    if(Math.hypot(c.cx-pcx,c.cz-pcz)>VIEW+2.5){
      if(c.mesh){scene.remove(c.mesh);c.mesh.geometry.dispose();}
      if(c.wmesh){scene.remove(c.wmesh);c.wmesh.geometry.dispose();}
      world.chunks.delete(k);
    }
  }
  // build meshes nearest-first inside a frame time budget
  const dirty=[];
  for(const[k,c]of world.chunks)if(c.dirty)dirty.push(c);
  meshQueueLen=dirty.length;
  if(!dirty.length)return;
  dirty.sort((a,b)=>Math.hypot(a.cx-pcx,a.cz-pcz)-Math.hypot(b.cx-pcx,b.cz-pcz));
  const meshMs=force?1e9:(blocking?12:6);
  const t1=performance.now();
  let built=0;
  for(const c of dirty){
    if(!force&&Math.hypot(c.cx-pcx,c.cz-pcz)>VIEW+.8)continue;
    buildMesh(c);
    built++;
    if(!force&&performance.now()-t1>meshMs)break;
    if(force&&built>400)break;
  }
}
function rebuildAllChunks(){
  for(const[k,c]of world.chunks)c.dirty=true;
}

   13. PLAYER UPDATE
   ========================================================================== */
function updatePlayer(dt){
  // keyboard look, so the game is playable even where mouse capture is blocked
  const look=2.1*dt;
  if(keys.ArrowLeft)player.yaw+=look;
  if(keys.ArrowRight)player.yaw-=look;
  if(keys.ArrowUp)player.pitch=clamp(player.pitch+look,-1.553,1.553);
  if(keys.ArrowDown)player.pitch=clamp(player.pitch-look,-1.553,1.553);
  // double-tap jump toggles creative flight, exactly like the real thing
  const jumpNow=isDown('jump');
  const jumpPressed=jumpNow&&!player._jumpPrev;
  player._jumpPrev=jumpNow;
  if(player.flyTapT>0)player.flyTapT-=dt;
  if(creative()){
    if(jumpPressed){
      if(player.flyTapT>0){ player.flying=!player.flying; player.flyTapT=0;
        player.vel.y=0; toast(player.flying?'Flying':'Flying off'); }
      else player.flyTapT=0.32;
    }
  }else player.flying=false;

  // double-tap forward starts a sprint, the way it does in vanilla
  const fwdNow=isDown('forward');
  const fwdPressed=fwdNow&&!player._fwdPrev;
  player._fwdPrev=fwdNow;
  if(player.fwdTapT>0)player.fwdTapT-=dt;
  if(fwdPressed){
    if(player.fwdTapT>0){ player.sprintBurst=true; player.fwdTapT=0; }
    else player.fwdTapT=0.32;
  }
  if(!fwdNow)player.sprintBurst=false;

  const flying=player.flying&&creative();
  const speedBase=flying?(player.sprint?13.5:6.6)
    :(player.inWater?3.1:(player.sprint?6.2:(player.sneak?1.45:4.3)));
  let fx=0,fz=0;
  if(isDown('forward'))fz+=1; if(isDown('back'))fz-=1;
  if(isDown('left'))fx-=1;    if(isDown('right'))fx+=1;
  const canSprint=creative()||player.food>6||!DIFF[game.difficulty].hunger;
  const sprintKey=player.sprintBurst||
    (settings.sprintToggle?sprintLatched:(isDown('sprint')||keys.ShiftRight));
  player.sprint=sprintKey&&canSprint&&fz>0;
  if(!canSprint)player.sprintBurst=false;
  player.sneak=settings.sneakToggle?sneakLatched:isDown('sneak');
  const len=Math.hypot(fx,fz)||1;
  fx/=len;fz/=len;
  const sin=Math.sin(player.yaw),cos=Math.cos(player.yaw);
  const wx=fx*cos-fz*sin, wz=-fx*sin-fz*cos;
  const target=new THREE.Vector3(wx*speedBase,0,wz*speedBase);
  const accel=flying?0.22:(player.onGround?0.30:0.10);
  player.vel.x=lerp(player.vel.x,target.x,accel*dt*60/1);
  player.vel.z=lerp(player.vel.z,target.z,accel*dt*60/1);
  if(flying){
    let vy=0;
    if(jumpNow)vy+=speedBase*0.72;
    if(player.sneak)vy-=speedBase*0.72;
    player.vel.y=lerp(player.vel.y,vy,0.30*dt*60);
    player.fallStart=null;
  }else if(player.inWater){
    player.vel.y=Math.max(player.vel.y-9*dt,-3.2);
    if(jumpNow)player.vel.y=3.4;
    player.fallStart=null;
  }else{
    player.vel.y-=26*dt;
    if(jumpNow&&player.onGround){player.vel.y=8.6;stats.jumps++;exhaust(player.sprint?0.2:0.05);}
  }
  const prevY=player.pos.y;
  moveEntity(player,dt,player.W,player.H);
  const moveSpeed=Math.hypot(player.vel.x,player.vel.z);
  if(player.onGround&&!flying&&moveSpeed>1.5){
    player.stepT=(player.stepT||0)+dt*moveSpeed;
    if(player.stepT>2.6){player.stepT=0;sfx.step();}
  }
  if(flying&&player.onGround&&player.vel.y<=0&&!jumpNow)player.flying=false;
  // fall damage
  if(!player.onGround&&player.vel.y<0&&player.fallStart===null&&!player.inWater&&!flying)
    player.fallStart=prevY;
  if(player.onGround){
    if(player.fallStart!==null){
      const d=player.fallStart-player.pos.y;
      if(d>0.5)stats.fallen+=d;
      if(d>3.2&&!creative())hurtPlayer(Math.floor(d-3),'the fall');
      player.fallStart=null;
    }
  }
  if(player.pos.y<-5)hurtPlayer(20,'the void',true);
  if(player.attackCd>0)player.attackCd-=dt;
  if(player.useCd>0)player.useCd-=dt;
  if(player.bowCharge>=0)player.bowCharge+=dt;
  // camera
  const headB=world.getBlock(Math.floor(player.pos.x),Math.floor(player.pos.y+player.EYE),
    Math.floor(player.pos.z));
  const submerged=(headB===B.water);
  if(submerged!==player.submerged){
    player.submerged=submerged;
    screenFx.water=submerged?0.55:0;
  }
  const baseFov=zoomHeld?20:settings.fov;
  const fe=settings.fovEffects;
  const wantFov=baseFov+(submerged?-6*fe:0)+((player.sprint&&moveSpeed>2)?8*fe:0);
  if(Math.abs(camera.fov-wantFov)>0.08){
    camera.fov=lerp(camera.fov,wantFov,0.14);
    camera.updateProjectionMatrix();
  }
  /* view bobbing: the camera swings through a figure-of-eight in step with
     the walk cycle, and rolls slightly into each footfall. */
  if(player.onGround&&moveSpeed>0.4)player.bobT=(player.bobT||0)+dt*moveSpeed*0.62;
  player.crouch=lerp(player.crouch||0,player.sneak?0.22:0,Math.min(1,dt*14));
  let obx=0,oby=0,roll=0,tilt=0;
  if(settings.viewBobbing&&player.onGround&&!submerged){
    const k=clamp(moveSpeed/4.6,0,1), f=(player.bobT||0)*Math.PI;
    obx=Math.sin(f)*0.085*k;
    oby=-Math.abs(Math.cos(f))*0.085*k;
    roll=Math.sin(f)*0.050*k;
    tilt=Math.abs(Math.cos(f-0.2))*0.032*k;
  }
  const rgt=Math.cos(player.yaw), rgz=-Math.sin(player.yaw);
  camera.position.set(player.pos.x+rgt*obx,
                      player.pos.y+player.EYE-player.crouch+oby,
                      player.pos.z+rgz*obx);
  camera.rotation.set(0,0,0,'YXZ');
  camera.rotation.order='YXZ';
  camera.rotation.y=player.yaw;
  camera.rotation.x=player.pitch+tilt;
  camera.rotation.z=roll+(screenFx.damage>0?Math.sin(performance.now()/38)*0.035*screenFx.damage*settings.damageTilt:0);
  // aim
  const hit=raycast(eyePos(),camDir(),5.4);
  aimHit=hit;
  if(hit){highlight.visible=true;highlight.position.set(hit.x+.5,hit.y+.5,hit.z+.5);}
  else highlight.visible=false;
  // continuous actions
  if(mouse.left&&!uiOpen()){
    if(aimHit)mineTick(dt);
    else{mining=null;breakOverlay.visible=false;}
    if(player.attackCd<=0){attack();swingHand();}
  }
  updateHand(dt);
  if(mouse.right&&!uiOpen()&&player.useCd<=0){
    const it=heldItem();
    if(it&&it.place!=null)placeBlock();
  }
}

/* ==========================================================================
   14. SKY
   ========================================================================== */
const DAYSKY=new THREE.Color(0x8fc0e8), NIGHTSKY=new THREE.Color(0x070c16),
      DUSK=new THREE.Color(0xd98a55), CLOUD_WHITE=new THREE.Color(0xffffff);
function updateSky(){
  const t=(game.time%DAY)/DAY;
  const d=daylight();
  const duskAmt=Math.max(0,1-Math.abs(Math.sin(t*Math.PI*2))*3.2)*(d>0.2?1:0.35);
  skyColor.copy(NIGHTSKY).lerp(DAYSKY,clamp((d-0.08)/0.92,0,1));
  skyColor.lerp(DUSK,duskAmt*0.45);
  uniforms.daylight.value=d;
  uniforms.fogColor.value.copy(skyColor);
  const far=VIEW*16;
  uniforms.fogNear.value=far*(settings.graphics==='fancy'?0.62:0.45);
  uniforms.fogFar.value=far*0.97;
  uniforms.gamma.value=settings.brightness;
  uniforms.contrast.value=settings.highContrast?1:0;
  mobLight.intensity=0.35+0.75*d;
  mobSun.intensity=0.25+0.5*d;
  const ang=t*Math.PI*2;
  skyGroup.position.copy(camera.position);
  skyGroup.updateMatrixWorld&&skyGroup.updateMatrixWorld();
  sunMesh.position.set(Math.cos(ang)*160,Math.sin(ang)*160,40);
  sunMesh.lookAt(camera.position);
  moonMesh.position.set(-Math.cos(ang)*160,-Math.sin(ang)*160,40);
  moonMesh.lookAt(camera.position);
  starMat.opacity=settings.sunMoon?clamp(1.25-d*2.4,0,0.9):0;
  sunMesh.visible=moonMesh.visible=settings.sunMoon;
  stars.rotation.y=t*Math.PI*2*0.12;
  clouds.position.set(camera.position.x,116,camera.position.z);
  cloudTex.offset.set(camera.position.x/900+game.time*0.0016, -camera.position.z/900);
  clouds.visible=(settings.clouds!=='off');
  clouds.material.opacity=(0.28+0.42*d)*(settings.clouds==='fast'?0.7:1);
  clouds.material.color.copy(skyColor).lerp(CLOUD_WHITE,0.55+0.35*d);
}

/* ============================ panorama ============================ */
/* ==========================================================================
   PANORAMA — the slowly drifting world behind the title screen.

   Minecraft ships six pre-rendered PNGs. We have a world generator, so we
   generate a small scenic chunk of terrain once, photograph it into a cube
   map, throw the geometry away, and then spin a camera inside the cube for
   the rest of the session. Costs one render and ~4 MB of VRAM.
   ========================================================================== */
let panoScene=null, panoCam=null, panoTarget=null;
let panoReady=false, panoBuilding=false, panoAngle=0, panoFailed=false;

function nextFrame(){ return new Promise(r=>requestAnimationFrame(()=>r())); }

function panoramaLive(){ return panoReady && !worldInMemory(); }

/* Look for somewhere worth photographing: high ground, not ocean, ideally
   with a bit of biome variety in frame. */
function findScenicSpot(){
  let bx=0,bz=0,best=-1e9;
  for(let i=0;i<220;i++){
    const x=(Math.random()*700-350)|0, z=(Math.random()*700-350)|0;
    const h=world.heightAt(x,z);
    const b=world.biomeName(x,z,h);
    if(b==='ocean')continue;
    let score=h*1.4;
    if(b==='forest')score+=22;
    if(b==='mountains')score+=26;
    if(b==='plains')score+=10;
    if(b==='desert')score-=14;
    // reward variety within view
    const seen={};
    for(let k=0;k<8;k++){
      const ax=x+Math.round(Math.cos(k/8*6.283)*46), az=z+Math.round(Math.sin(k/8*6.283)*46);
      seen[world.biomeName(ax,az,world.heightAt(ax,az))]=1;
    }
    score+=Object.keys(seen).length*11;
    if(score>best){best=score;bx=x;bz=z;}
  }
  return [bx,bz];
}

async function buildPanorama(){
  if(panoBuilding||panoReady||panoFailed||worldInMemory())return;
  panoBuilding=true;
  const savedTime=game.time;
  try{
    world.init(hashStr('panorama:'+GAME_VERSION));
    const [sx,sz]=findScenicSpot();
    const pcx=sx>>4, pcz=sz>>4, R=5;
    const list=[];
    for(let dx=-R;dx<=R;dx++)for(let dz=-R;dz<=R;dz++){
      const d=Math.hypot(dx,dz);
      if(d<=R+0.5)list.push([d,pcx+dx,pcz+dz]);
    }
    list.sort((a,b)=>a[0]-b[0]);
    for(let i=0;i<list.length;i++){
      const c=genChunk(list[i][1],list[i][2]);
      chunkSkyColumns(c);propagate();
      markDirtyAround(list[i][1]<<4,0,list[i][2]<<4);
      if((i&7)===7)await nextFrame();
    }
    let n=0;
    for(const[k,c]of world.chunks){
      if(c.dirty)buildMesh(c);
      if((++n&15)===15)await nextFrame();
    }

    // golden hour reads best, and it hides the render-distance edge
    game.time=DAY*0.735;
    const eyeY=Math.max(SEA+8, surfaceY(sx,sz)+11);
    const oldNear=uniforms.fogNear.value, oldFar=uniforms.fogFar.value;
    const oldPos=camera.position.clone();
    camera.position.set(sx+0.5,eyeY,sz+0.5);
    updateSky();
    uniforms.fogNear.value=68; uniforms.fogFar.value=R*16*0.98;

    const size=Math.min(1024,Math.max(256,(renderer.capabilities.maxTextureSize/4)|0));
    panoTarget=new THREE.WebGLCubeRenderTarget(size,{
      minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,generateMipmaps:false});
    const cube=new THREE.CubeCamera(0.5,R*16+40,panoTarget);
    cube.position.set(sx+0.5,eyeY,sz+0.5);
    skyGroup.position.copy(cube.position);
    skyGroup.updateMatrixWorld(true);

    renderer.autoClear=true;
    cube.update(renderer,scene);
    renderer.autoClear=false;

    uniforms.fogNear.value=oldNear; uniforms.fogFar.value=oldFar;
    camera.position.copy(oldPos);

    panoScene=new THREE.Scene();
    panoScene.background=panoTarget.texture;
    panoCam=new THREE.PerspectiveCamera(78,1,0.1,10);
    panoCam.rotation.order='YXZ';
    panoReady=true;
  }catch(e){
    console.warn('panorama unavailable:',e);
    panoFailed=true; panoReady=false;
  }finally{
    game.time=savedTime;
    clearWorldWithMeshes();
    panoBuilding=false;
  }
}

function renderPanorama(dt){
  if(!panoReady)return false;
  panoAngle+=dt*0.035*settings.panoramaSpeed;
  const aspect=Math.max(0.1,innerWidth/innerHeight);
  if(panoCam.aspect!==aspect){panoCam.aspect=aspect;panoCam.updateProjectionMatrix();}
  panoCam.rotation.y=panoAngle;
  panoCam.rotation.x=-0.045+Math.sin(panoAngle*0.63)*0.055;
  renderer.setClearColor(0x000000,1);
  renderer.clear();
  renderer.render(panoScene,panoCam);
  return true;
}

/* ---------- crafting ---------- */
function computeCraftOut(){
  const size=inv.craftSize;
  const g=new Array(size*size).fill(null);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++)g[y*size+x]=inv.craft[y*3+x];
  const r=matchCraft(g,size);
  inv.craftOut=r?stack(r.out,r.n):null;
}
function consumeCraft(){
  for(let k=0;k<9;k++){
    const s=inv.craft[k];
    if(s){ s.n--; if(!s.n)inv.craft[k]=null; }
  }
  stats.crafted++;
  sfx.craft&&sfx.craft();
  computeCraftOut();
}

/* ---------- settings ---------- */
function applyVolumes(){
  const v=settings.muted?0:settings.volMaster;
  sfx.setMaster&&sfx.setMaster(v);
}
function applySettings(){
  computeGuiScale();
  VIEW=settings.renderDistance;
  camera.far=Math.max(96,VIEW*16*1.75);
  camera.fov=settings.fov;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  if(atlasTex){
    const want=settings.mipmap>0;
    if(atlasTex.generateMipmaps!==want){
      atlasTex.generateMipmaps=want;
      atlasTex.minFilter=want?THREE.NearestMipmapLinearFilter:THREE.NearestFilter;
      atlasTex.needsUpdate=true;
    }
  }
  uniforms.gamma.value=settings.brightness;
  uniforms.contrast.value=settings.highContrast?1:0;
  clouds.visible=(settings.clouds!=='off');
  applyVolumes();
  saveSettings();
}

/* ---------- world teardown ---------- */
function clearWorldWithMeshes(){
  for(const[k,c]of world.chunks){
    if(c.mesh){scene.remove(c.mesh);c.mesh.geometry.dispose();}
    if(c.wmesh){scene.remove(c.wmesh);c.wmesh.geometry.dispose();}
  }
  world.chunks.clear();
  for(const m of[...game.mobs])removeMob(m);
  for(const it of game.items)scene.remove(it.mesh);
  game.items.length=0;
  for(const a of game.arrows)scene.remove(a.mesh);
  game.arrows.length=0;
  for(const pt of particles)scene.remove(pt.mesh);
  particles.length=0;
}
function discardWorld(){
  clearWorldWithMeshes();
  game.worldLoaded=false;
  game.worldId=null;
  game.running=false;
  game.dead=false;
  backdropReady=false;
  openFurnaceKey=null;
  inv.cursor=null;
}

/* ---------- progressive world build, so the tab never locks up ---------- */
async function buildAround(prog){
  const R=Math.min(settings.renderDistance,8);
  const pcx=Math.floor(player.pos.x)>>4, pcz=Math.floor(player.pos.z)>>4;
  const list=[];
  for(let dx=-R;dx<=R;dx++)for(let dz=-R;dz<=R;dz++){
    const d=Math.hypot(dx,dz);
    if(d<=R+0.5)list.push([d,pcx+dx,pcz+dz]);
  }
  list.sort((a,b)=>a[0]-b[0]);
  for(let i=0;i<list.length;i++){
    if(!world.chunks.has(ckey(list[i][1],list[i][2]))){
      const c=genChunk(list[i][1],list[i][2]);
      chunkSkyColumns(c);propagate();
      markDirtyAround(list[i][1]<<4,0,list[i][2]<<4);
    }
    if((i&5)===5){ prog(0.05+0.55*i/list.length,'Building terrain'); await nextFrame(); }
  }
  const dirty=[];
  for(const[k,c]of world.chunks)if(c.dirty)dirty.push(c);
  dirty.sort((a,b)=>Math.hypot(a.cx-pcx,a.cz-pcz)-Math.hypot(b.cx-pcx,b.cz-pcz));
  for(let i=0;i<dirty.length;i++){
    buildMesh(dirty[i]);
    if((i&3)===3){ prog(0.6+0.38*i/dirty.length,'Building terrain'); await nextFrame(); }
  }
  prog(1,'Loading world');
}

  player.fireT=0;player.poisonT=0;player.breath=10;

}

/* ---------- saving ---------- */
const iconCv=document.createElement('canvas'); iconCv.width=64; iconCv.height=64;
const iconCtx=iconCv.getContext('2d');
let iconFresh=false;
function captureWorldIcon(){
  try{
    const s=Math.min(canvas.width,canvas.height);
    iconCtx.drawImage(canvas,(canvas.width-s)/2,(canvas.height-s)/2,s,s,0,0,64,64);
    iconFresh=true;

async function saveWorld(){
  if(!worldInMemory()||!game.worldId)return false;
  if(savingNow)return false;
  savingNow=true;
  let ok=false;
  try{
    const furn={};
    for(const[k,f]of world.furnaces){
      if(!f.input&&!f.fuel&&!f.out&&!f.burn)continue;
      furn[k]={i:f.input,f:f.fuel,o:f.out,b:f.burn,bm:f.burnMax,c:f.cook};
    }
    const data={
      v:SAVE_VERSION, seed:world.seed, seedText:game.seedText, name:game.worldName,
      difficulty:game.difficulty, gameMode:game.gameMode, hardcore:game.hardcore,
      worldType:game.worldType, structures:game.structures, cheats:game.cheats,
      time:game.time, day:game.day, spawn:game.spawnPoint,
      xpLevel:game.xpLevel, xpProgress:game.xpProgress, xpPoints:game.xpPoints||0,
      player:{x:player.pos.x,y:player.pos.y,z:player.pos.z,yaw:player.yaw,pitch:player.pitch,
        hp:player.hp,food:player.food,sat:player.sat},
      inv:{main:packInv(inv.main),armor:packInv(inv.armor),sel:inv.sel},
      drops:game.items.slice(0,200).map(i=>({x:+i.pos.x.toFixed(2),y:+i.pos.y.toFixed(2),
        z:+i.pos.z.toFixed(2),id:i.id,n:i.n})),
      edits:packEdits(world.edits),
      furn, stats
    };
    await Store.set('dw:world:'+game.worldId,JSON.stringify(data));
    if(iconFresh){
      try{ await Store.set('dw:icon:'+game.worldId,iconCv.toDataURL('image/png')); }catch(e){}
      iconFresh=false;
    }
    const idx=await readIndex();
    let m=idx.find(w=>w.id===game.worldId);
    if(!m){ m={id:game.worldId,created:Date.now()}; idx.push(m); }
    m.name=game.worldName;
    m.folder=game.worldName.replace(/[^A-Za-z0-9 _-]/g,'')+' ('+game.worldId.slice(-4)+')';
    m.lastPlayed=Date.now();
    m.gameMode=game.gameMode; m.hardcore=game.hardcore;
    m.seed=world.seed; m.seedText=game.seedText;
    m.day=game.day; m.version=GAME_VERSION;
    m.worldType=game.worldType; m.structures=game.structures;
    await writeIndex(idx);
    ok=true;
  }catch(e){ console.warn('save failed',e); }
  savingNow=false;
  return ok;
}
let savePending=false;
function requestSave(){
  if(savePending||!worldInMemory())return;
  savePending=true;
  setTimeout(()=>{ savePending=false; saveWorld(); },60);
}

async function quitToTitle(){
  if(worldInMemory()){
    const scr=new ProgressScreen('Saving world');
    scr.stage='Saving chunks'; scr.progress=0.5;
    openScreen(scr);
    await nextFrame();
    await saveWorld();
    scr.progress=1;
    await nextFrame();
  }
  discardWorld();
  openScreen(new TitleScreen());
  if(!panoReady&&!panoBuilding)buildPanorama();
}

/* ---------- window helpers ---------- */
function toggleFullscreen(){
  try{
    if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(e){ toast('Fullscreen unavailable here'); }
}
function takeScreenshot(){
  try{
    const out=document.createElement('canvas');
    out.width=canvas.width; out.height=canvas.height;
    const c=out.getContext('2d');
    c.drawImage(canvas,0,0);
    c.imageSmoothingEnabled=false;
    c.drawImage(guiCanvas,0,0,out.width,out.height);
    out.toBlob(b=>{
      if(!b){ toast('Screenshot failed'); return; }
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download=GAME_NAME.toLowerCase()+'-'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      chat('\u00a7aScreenshot saved');
    },'image/png');
  }catch(e){ toast('Screenshot failed'); }
}

/* ---------- chat ---------- */
const chatInput=new TextField(0,0,320,12,'',()=>{});
chatInput.maxLen=256;
chatInput.bordered=false;
function openChat(prefix){
  chatOpen=true; chatHistIdx=-1;
  chatInput.setText(prefix||'');
  chatInput.focused=true;
  if(document.pointerLockElement)document.exitPointerLock();
  syncRunState();
}
function closeChat(send){
  const text=chatInput.text.trim();
  chatOpen=false; chatInput.focused=false;
  chatInput.setText('');
  if(send&&text){
    chatHistory.unshift(text);
    if(chatHistory.length>64)chatHistory.pop();
    if(text[0]==='/')runCommand(text.slice(1));
    else chat('\u00a77<Player> \u00a7f'+text);
  }
  syncRunState();
  if(gameIsLive())grabPointer();
}
function runCommand(line){
  const p=line.trim().split(/\s+/);
  const cmd=(p[0]||'').toLowerCase();
  if(!game.cheats&&['give','tp','time','gamemode','heal'].includes(cmd)){
    chat('\u00a7cCheats are disabled in this world.'); return;
  }
  switch(cmd){
    case 'help':
      chat('\u00a7e/help /seed /time set <day|night> /tp <x> <y> <z> /give <item> [n] /heal /gamemode <s|c>');
      break;
    case 'seed': chat('\u00a7eSeed: \u00a7f'+game.seedText); break;
    case 'time':
      if(p[1]==='set'){
        if(p[2]==='day')game.time=Math.floor(game.time/DAY)*DAY+DAY*0.15;
        else if(p[2]==='night')game.time=Math.floor(game.time/DAY)*DAY+DAY*0.7;
        chat('\u00a7aTime set.');
      }else chat('\u00a7cUsage: /time set day|night');
      break;
    case 'tp':
      if(p.length>=4){ player.pos.set(+p[1],+p[2],+p[3]); player.vel.set(0,0,0);
        ensureChunksAround(true); chat('\u00a7aTeleported.'); }
      else chat('\u00a7cUsage: /tp <x> <y> <z>');
      break;
    case 'heal': player.hp=20; player.food=20; chat('\u00a7aHealed.'); break;
    case 'gamemode':{
      const a=(p[1]||'').toLowerCase();
      const mode=(a[0]==='c'||a==='1')?'creative':'survival';
      setGameMode(mode);
      chat('\u00a7aGame mode set to '+modeLabel(mode));
      if(mode==='creative')chat('\u00a77Press '+keyName(settings.keys.inventory)+
        ' for the item catalogue, double-tap jump to fly.');
      break;
    }
    case 'give':{
      const id=ITEM_ID((p[1]||'').toLowerCase());
      if(id==null){ chat('\u00a7cUnknown item.'); break; }
      addItem(id,Math.max(1,Math.min(64,parseInt(p[2]||'1',10)||1)));
      refreshUI(); chat('\u00a7aGiven.');
      break;
    }
    default: chat('\u00a7cUnknown command. Try /help');
  }
}

/* ==========================================================================
   INPUT
   ========================================================================== */
function bound(action,code){ return settings.keys[action]===code; }

function toggleMute(){
  settings.muted=!settings.muted; applyVolumes();
  toast(settings.muted?'Sound off':'Sound on');
}

addEventListener('keydown',e=>{
  const code=e.code;

  // always-available window keys (guarded against OS key-repeat spam).
  // Function keys never collide with typed text, so these fire unconditionally.
  if(bound('fullscreen',code)){ e.preventDefault(); if(!e.repeat)toggleFullscreen(); return; }
  if(bound('screenshot',code)){ e.preventDefault(); if(!e.repeat)takeScreenshot(); return; }

  if(chatOpen){
    e.preventDefault();
    if(code==='Escape'){ closeChat(false); return; }
    if(code==='Enter'||code==='NumpadEnter'){ closeChat(true); return; }
    if(code==='ArrowUp'&&chatHistory.length){
      chatHistIdx=Math.min(chatHistIdx+1,chatHistory.length-1);
      chatInput.setText(chatHistory[chatHistIdx]); return;
    }
    if(code==='ArrowDown'){
      chatHistIdx=Math.max(chatHistIdx-1,-1);
      chatInput.setText(chatHistIdx<0?'':chatHistory[chatHistIdx]); return;
    }
    if(chatInput.keyDown(e))return;
    if(e.key&&e.key.length===1&&!e.ctrlKey&&!e.metaKey)chatInput.charTyped(e.key);
    return;
  }

  if(currentScreen){
    if(code==='Tab'||code.startsWith('Arrow')||code==='Space')e.preventDefault();
    if(currentScreen.keyDown(e)){ e.preventDefault(); return; }
    if(e.key&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&currentScreen.charTyped(e.key)){
      e.preventDefault(); return;
    }
    // Escape or the inventory key closes a container
    if(!currentScreen.pausesGame&&bound('inventory',code)){
      e.preventDefault(); closeScreens(); return;
    }
    // Letter shortcuts like mute only reach here once no focused widget
    // (e.g. a TextField typing a world name) has claimed the keystroke.
    if(bound('muteSound',code)&&!e.repeat)toggleMute();
    return;
  }

  if(!worldInMemory()){
    if(bound('muteSound',code)&&!e.repeat)toggleMute();
    return;
  }
  if(code.startsWith('Arrow')||code==='Space'||code==='Tab')e.preventDefault();

  keys[code]=true;
  if(code==='ShiftLeft'||code==='ShiftRight')shiftHeld=true;
  if(code==='ControlLeft'||code==='ControlRight')ctrlHeld=true;

  if(e.repeat)return;

  if(code==='Escape'){ pauseGame(); return; }
  if(bound('debug',code)){ debugOn=!debugOn; return; }
  if(code==='F1'){ hudHidden=!hudHidden; return; }
  if(bound('muteSound',code)){ toggleMute(); return; }
  if(bound('zoom',code)){ zoomHeld=true; return; }
  if(bound('chat',code)){ openChat(''); return; }
  if(bound('command',code)){ openChat('/'); return; }
  if(bound('inventory',code)){ openInventory(false); return; }
  if(bound('sprint',code)&&settings.sprintToggle){ sprintLatched=!sprintLatched; return; }
  if(bound('sneak',code)&&settings.sneakToggle){ sneakLatched=!sneakLatched; return; }
  if(bound('drop',code)){ dropHeld(ctrlHeld); return; }
  for(let i=1;i<=9;i++)if(bound('hotbar'+i,code)){ inv.sel=i-1; refreshUI(); return; }
  if(code==='KeyB'&&game.worldLoaded)trySleep();
  if(code==='KeyF')toggleFishing();
},{passive:false});

addEventListener('keyup',e=>{
  keys[e.code]=false;
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')shiftHeld=false;
  if(e.code==='ControlLeft'||e.code==='ControlRight')ctrlHeld=false;
  if(bound('zoom',e.code))zoomHeld=false;
});
addEventListener('blur',()=>{
  for(const k in keys)keys[k]=false;
  shiftHeld=ctrlHeld=zoomHeld=false;
  mouse.left=mouse.right=false;
});

function dropHeld(all){
  const s=inv.main[inv.sel];
  if(!s)return;
  const n=all?s.n:1;
  const d=camDir();
  spawnItem(player.pos.x+d.x*0.6,player.pos.y+1.1,player.pos.z+d.z*0.6,s.id,n,s.d);
  s.n-=n;
  if(s.n<=0)inv.main[inv.sel]=null;
  refreshUI();
}

/* ---------- mouse ---------- */
guiCanvas.addEventListener('mousedown',e=>{
  e.preventDefault();
  sfx.init();
  if(chatOpen){ closeChat(true); return; }
  if(currentScreen){
    const p=toGui(e);
    guiMouse.x=p.x; guiMouse.y=p.y; guiMouse.down=true;
    currentScreen.mouseDown(p.x,p.y,e.button);
    return;
  }
  if(!worldInMemory())return;
  if(!pointerLocked()&&settings.rawInput){ grabPointer(); return; }
  if(e.button===0){ mouse.left=true; attack(); }
  else if(e.button===2){ mouse.right=true; useItem(); }
  else if(e.button===1){ pickBlock(); }
});
guiCanvas.addEventListener('mouseup',e=>{
  if(currentScreen){
    const p=toGui(e);
    guiMouse.down=false;
    currentScreen.mouseUp(p.x,p.y,e.button);
    return;
  }
  if(e.button===0){ mouse.left=false; mining=null; }
  if(e.button===2){
    mouse.right=false;
    if(player.bowCharge!=null)releaseBow();
  }
});
guiCanvas.addEventListener('mousemove',e=>{
  if(currentScreen||chatOpen||!pointerLocked()){
    const p=toGui(e);
    guiMouse.x=p.x; guiMouse.y=p.y;
    if(currentScreen&&guiMouse.down)currentScreen.mouseDrag(p.x,p.y);
    return;
  }
  if(!gameIsLive())return;
  const s=0.0006+settings.sensitivity*0.0034;
  const inv1=settings.invertMouse?-1:1;
  player.yaw-=e.movementX*s;
  player.pitch=clamp(player.pitch-e.movementY*s*inv1,-1.553,1.553);
});
guiCanvas.addEventListener('wheel',e=>{
  e.preventDefault();
  if(currentScreen){
    const p=toGui(e);
    currentScreen.wheel(p.x,p.y,Math.sign(e.deltaY));
    return;
  }
  if(!worldInMemory())return;
  const d=Math.sign(e.deltaY);
  inv.sel=(inv.sel+d+9)%9;
  refreshUI();
},{passive:false});
guiCanvas.addEventListener('contextmenu',e=>e.preventDefault());

function pickBlock(){
  if(!aimHit)return;
  const id=world.getBlock(aimHit.x,aimHit.y,aimHit.z);
  const item=ITEM_ID(BLOCKS[id]&&BLOCKS[id].name);
  if(item==null)return;
  for(let i=0;i<9;i++)if(inv.main[i]&&inv.main[i].id===item){ inv.sel=i; refreshUI(); return; }
  if(creative()){
    // creative hands it over: prefer an empty hotbar slot, else replace the held one
    let slot=inv.sel;
    for(let i=0;i<9;i++)if(!inv.main[i]){ slot=i; break; }
    inv.main[slot]=stack(item,maxStack(item));
    inv.sel=slot; sfx.pickup(); refreshUI();
    itemNameT=2; lastItemName=ITEMS[item].label;
    return;
  }
  toast('Not in your hotbar');
}

document.addEventListener('pointerlockchange',()=>{
  if(pointerLocked())return;
  if(worldInMemory()&&!currentScreen&&!chatOpen&&!game.dead)pauseGame();
});
addEventListener('resize',()=>{ resize(); computeGuiScale(); if(currentScreen)currentScreen.rebuild(); });

/* ==========================================================================
   MAIN LOOP
   ========================================================================== */
function drawOverlayFx(g){
  if(screenFx.water>0){
    rectA(g,0,0,guiW,guiH,'#1b4a74',screenFx.water*0.8);
  }
  if(screenFx.damage>0){
    const cx=guiW/2, cy=guiH/2;
    const grd=g.createRadialGradient(cx,cy,Math.min(guiW,guiH)*0.16,cx,cy,Math.max(guiW,guiH)*0.62);
    grd.addColorStop(0,'rgba(120,20,12,0)');
    grd.addColorStop(1,'rgba(120,20,12,'+Math.min(0.85,screenFx.damage).toFixed(3)+')');
    g.fillStyle=grd; g.fillRect(0,0,guiW,guiH);
  }
  if(screenFx.sleep>0)rectA(g,0,0,guiW,guiH,'#000000',screenFx.sleep);
  // low-light vignette
  const lv=clamp(1-lightAt(player.pos.x,player.pos.y+1,player.pos.z)*1.7,0,1);
  if(lv>0.02&&settings.graphics==='fancy'){
    const cx=guiW/2, cy=guiH/2;
    const grd=g.createRadialGradient(cx,cy,Math.min(guiW,guiH)*0.22,cx,cy,Math.max(guiW,guiH)*0.66);
    grd.addColorStop(0,'rgba(0,0,0,0)');
    grd.addColorStop(1,'rgba(0,0,0,'+(lv*0.55).toFixed(3)+')');
    g.fillStyle=grd; g.fillRect(0,0,guiW,guiH);
  }
}


function tickWorld(dt){
  game.time+=dt;
  const d=Math.floor(game.time/DAY)+1;
  if(d>game.day){ game.day=d; toast('Day '+d); }
  if(lastPos){
    const dist=Math.hypot(player.pos.x-lastPos.x,player.pos.z-lastPos.z);
    if(dist<4){
      stats.walked+=dist;
      if(player.sprint)stats.sprinted+=dist;
      if(player.inWater)stats.swum+=dist;
    }
  }else lastPos={x:0,z:0};
  lastPos.x=player.pos.x; lastPos.z=player.pos.z;
  stats.playtime+=dt;
  stats.deepest=Math.min(stats.deepest,Math.floor(player.pos.y));
  biomeT+=dt;
  if(biomeT>1.5){
    biomeT=0;
    const bx=Math.floor(player.pos.x), bz=Math.floor(player.pos.z);
    const bn=world.biomeName(bx,bz,world.heightAt(bx,bz));
    if(bn&&!stats.biomeSet[bn]){ stats.biomeSet[bn]=1; stats.biomes=Object.keys(stats.biomeSet).length; }
  }

  updatePlayer(dt);
  statsTick(dt);
  updateMobs(dt);
  updateArrows(dt);
  updateItems(dt);
  fishTick(dt);
  updateParticles(dt);
  cropTick(dt);
  gravityTick();
  furnaceTick(dt);
  updateHand(dt);

  spawnT+=dt;
  if(spawnT>2){ spawnT=0; trySpawnMobs(); }
  saveT+=dt;
  if(saveT>(settings.autoSave?45:1e9)){ saveT=0; requestSave(); }
  iconT+=dt;
}

let biomeT=0;
let last=performance.now(), fpsAcc=0, fpsFrames=0;
function loop(now){
  requestAnimationFrame(loop);

  // framerate cap
  if(!settings.vsync&&settings.maxFramerate<260){
    const cap=1000/settings.maxFramerate;
    if(now-last<cap-0.6)return;
  }

  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,0.05);
  fpsFrames++; fpsAcc+=dt;
  if(fpsAcc>0.5){ fps=Math.round(fpsFrames/fpsAcc); fpsFrames=0; fpsAcc=0;
    fpsText=fps+' fps'; }

  const pausing=screenPauses();
  let drewWorld=false;

  if(worldInMemory()){
    const live=!pausing&&!game.dead&&!chatOpen;
    if(live)tickWorld(dt);
    else updateHand(0);
    if(!pausing||!backdropReady||wantBackdrop){
      ensureChunksAround();
      updateSky();
      renderer.setClearColor(uniforms.fogColor.value,1);
      renderer.clear();
      renderer.render(scene,camera);
      if(settings.showHand&&!hudHidden&&!pausing){
        renderer.clearDepth();
        renderer.render(handScene,handCam);
      }
      drewWorld=true;
      if(wantBackdrop)captureWorldBackdrop();
      if(live&&iconT>12){ iconT=0; captureWorldIcon(); }
    }
  }else{
    if(!renderPanorama(dt)){
      renderer.setClearColor(0x101010,1);
      renderer.clear();
    }
    drewWorld=true;
  }

  // ---- GUI layer ----
  computeGuiScale();
  gg.setTransform(guiDpr*guiScale,0,0,guiDpr*guiScale,0,0);
  gg.clearRect(0,0,guiW,guiH);
  gg.imageSmoothingEnabled=false;

  if(worldInMemory()&&!pausing)drawOverlayFx(gg);

  if(!currentScreen&&worldInMemory()&&!hudHidden){
    renderHUD(gg,dt);
    renderChat(gg);
    if(debugOn)renderDebug(gg);
  }
  if(chatOpen&&!currentScreen)renderChat(gg);
  if(currentScreen){
    currentScreen.tick(dt);
    currentScreen.render(gg,guiMouse.x,guiMouse.y,dt);
    if(worldInMemory()&&!currentScreen.pausesGame&&debugOn)renderDebug(gg);
  }
  if(savingNow)drawTextR(gg,'\u00a77Saving\u2026',guiW-3,3,'#a0a0a0');
}

/* ==========================================================================
   BOOT
   ========================================================================== */
uiClickSound=()=>{ sfx.init(); sfx.click&&sfx.click(); };
game.worldLoaded=false;
game.worldId=null;
game.gameMode='survival';
game.hardcore=false;
game.seedText='';
game.cheats=false;
game.xpLevel=0; game.xpProgress=0;
inv.craftSize=2;

resize();
applySettings();
buildLogo(GAME_NAME.toUpperCase());
computeGuiScale();

(async function boot(){
  await Store.ready;
  openScreen(new TitleScreen());
  requestAnimationFrame(loop);
  // the panorama builds in the background; the dirt backdrop covers for it
  setTimeout(()=>buildPanorama(),120);
})();

addEventListener('beforeunload',()=>{ if(worldInMemory())saveWorld(); });
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&worldInMemory())requestSave();
});

document.getElementById('boot').classList.add('hide');

</script>
